services:
  lanterns:
    build: .
    container_name: mid-autumn-lanterns
    restart: unless-stopped
    ports:
      - "3005:3000"                 # host 3005 (3000 is taken by buzz-prod-relay). Tunnel -> http://localhost:3005
    environment:
      # --- PUBLIC URL: the domain kids reach via Cloudflare Tunnel ---
      # QR + all links use this. MUST be your real tunnel hostname.
      PUBLIC_URL: "https://lantern.vml-team.site"

      # --- WPP AI proxy — it runs as a HOST python process on :3141 (NOT a container),
      #     so reach it through the host gateway, not a container name. ---
      WPP_PROXY_URL: "http://host.docker.internal:3141"
      # WPP_PROXY_KEY: "..."        # only if the proxy sets PROXY_API_KEY

      # --- AI image options (optional) ---
      WPP_IMAGE_MODEL: "gpt-image-2"
      WPP_IMAGE_QUALITY: "low"      # low | medium
      WPP_IMAGE_BACKGROUND: "transparent"
      # AI_RENDER: "0"             # set to disable AI entirely

      DB_PATH: "/data/lanterns.db"
    volumes:
      - lantern-data:/data                       # the SQLite db
      - lantern-images:/app/public/lanterns      # kids' generated images
    # lets the container reach a proxy running on the host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lantern-data:
  lantern-images:
