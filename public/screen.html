<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bầu trời lồng đèn</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0620;}
  canvas{display:block;}

  #audioTip{ position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:11;
             background:#8a1a12cc; color:#ffe9b0; border:1px solid #ffd77a; border-radius:20px;
             padding:8px 16px; font:600 14px system-ui,sans-serif; box-shadow:0 4px 16px #0007; }

  /* dòng đếm số lồng đèn — góc trên bên trái, chữ trắng, IN HOA, cỡ nhỏ */
  #countBar{ position:fixed; left:22px; top:20px; z-index:8;
             color:#fff; font:700 15px system-ui,sans-serif; text-transform:uppercase;
             line-height:1.35; letter-spacing:.4px; text-align:left;
             text-shadow:0 2px 8px #000a; pointer-events:none; }
  #countBar b{ color:#fff; }

  /* nút toàn màn hình — góc phải trên, kín đáo, không che canvas */
  #fsBtn{ position:fixed; right:18px; top:18px; z-index:12;
          background:#1a0f3ccc; color:#ffe9b0; border:1px solid #ffd77a; border-radius:20px;
          padding:8px 14px; font:600 14px system-ui,sans-serif; cursor:pointer;
          box-shadow:0 4px 16px #0007; transition:opacity .4s; }
  #fsBtn:hover{ opacity:1 !important; }

  /* Chú Cuội góc trái dưới — lắc lư nhẹ nhàng, tươi vui */
  #cuoiWrap{ position:fixed; left:12px; bottom:0; z-index:9; height:32vh; pointer-events:none; }
  /* gốc xoay ở vùng vai/cổ (~30% từ trên) -> chỉ phần đầu nghiêng, thân đứng yên */
  #chuCuoi{ height:100%; width:auto; display:block; transform-origin:50% 30%;
            filter:drop-shadow(0 0 20px #ffcf6a55) drop-shadow(0 6px 14px #0007);
            animation:cuoiNod 3.4s ease-in-out infinite; }
  /* quầng sáng ấm ngay chỗ lồng đèn (góc phải-trên ảnh) — làm đèn 'sống' */
  #cuoiLampGlow{ position:absolute; right:-2%; top:24%; width:34%; height:22%; border-radius:50%;
                 background:radial-gradient(circle, #ffdf9eaa 0%, #ffcf6a44 40%, transparent 70%);
                 filter:blur(2px); animation:lampFlicker 1.8s ease-in-out infinite; }
  @keyframes cuoiNod{
    0%   { transform:rotate(-2deg); }
    50%  { transform:rotate(2deg); }
    100% { transform:rotate(-2deg); }
  }
  @keyframes lampFlicker{ 0%,100%{ opacity:.55; transform:scale(1) } 50%{ opacity:1; transform:scale(1.12) } }

  /* Lồng đèn VML góc trái-trên — treo lơ lửng, sáng nhấp nháy như đèn thật */
  #vmlLantern{ position:fixed; left:30px; top:24px; z-index:9; width:15vh; max-width:150px;
    pointer-events:none; transform-origin:50% 8%;
    animation:vmlSway 4.6s ease-in-out infinite; }
  #vmlLantern img{ display:block; width:100%; height:auto;
    /* 3 lớp quầng: lõi vàng chói + cam giữa + toả đỏ rộng -> LED cháy rực bên trong */
    filter:drop-shadow(0 0 var(--g1,20px) #fff2c0) drop-shadow(0 0 var(--g2,44px) #ffb43acc)
           drop-shadow(0 0 var(--g3,80px) #ff7a1a88) drop-shadow(0 8px 18px #0008)
           brightness(var(--b,1));
    animation:vmlGlow 2s ease-in-out infinite; }
  @keyframes vmlSway{ 0%,100%{ transform:rotate(-2.5deg) translateY(0) } 50%{ transform:rotate(2.5deg) translateY(-6px) } }
  /* nhấp nháy không đều, biên độ mạnh (đèn thật lung linh rực rỡ) */
  @keyframes vmlGlow{
    0%,100%{ --g1:18px; --g2:36px; --g3:64px; --b:1;    opacity:.92 }
    30%    { --g1:26px; --g2:60px; --g3:104px; --b:1.22; opacity:1 }
    48%    { --g1:20px; --g2:42px; --g3:76px; --b:1.05; opacity:.95 }
    68%    { --g1:30px; --g2:70px; --g3:120px; --b:1.3;  opacity:1 }
    84%    { --g1:22px; --g2:48px; --g3:84px; --b:1.12; opacity:.97 }
  }
  /* QR góc phải dưới — khung tre cắt từ demo.jpeg, QR thật đặt đè lên ô trắng */
  #qrCard{ position:fixed; right:48px; bottom:60px; z-index:10; width:160px;
           text-align:center; font-family:system-ui,sans-serif;
           filter:drop-shadow(0 0 30px #ff9a1a55); }
  #qrLantern{ position:relative; width:160px; height:160px; margin:0 auto;
    background:url('/decor/qr-cube-final.png') center/contain no-repeat; }
  /* QR đã in sẵn trong ảnh khối tre -> ẩn ô overlay cũ để khỏi chồng hai lớp */
  #qrCard .box{ display:none; }
  #qrCard .box img{ position:relative; z-index:1; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
  /* nhãn dưới khung */
  #qrCard .tt{ color:#fff; font-weight:700; font-size:15px; margin-top:-6px; letter-spacing:.2px; white-space:nowrap;
    text-shadow:0 2px 8px #000a; }
  #qrCard .lt, #qrCard .ft{ display:none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="audioTip">🔊 Chạm một lần để bật âm thanh</div>
<div id="countBar">Đã có hơn <b id="countN">…</b> lồng đèn<br>được thả tại VML Việt Nam</div>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>

<!-- Lồng đèn VML góc trái-trên -->
<div id="vmlLantern"><img src="/decor/vml-lantern.png" alt="Lồng đèn VML"></div>


<!-- QR góc phải dưới -->
<div id="qrCard">
  <div id="qrLantern">
    <div class="box"><img id="qrImg" alt="QR"></div>
  </div>
  <div class="tt">Scan để tạo lồng đèn</div>
</div>
<!-- Socket.IO is served by our own server at /socket.io/... — no internet needed -->
<script src="/socket.io/socket.io.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  CÀI ĐẶT — chỉnh mọi thứ ở đây. Sửa số → Lưu (Cmd+S) → Refresh (Cmd+R)
// ══════════════════════════════════════════════════════════════════
const CONFIG = {
  maxLanterns:   40,      // số lồng đèn tối đa trên màn (ít hơn = thoáng, không chồng)
  lanternPx:     150,     // đường kính mục tiêu mỗi lồng đèn (px) — nhỏ = chứa nhiều bé hơn
  showNames:     true,    // hiện tên bé dưới mỗi lồng đèn khi bay (bé tự tìm được đèn mình)
  spotZoom:      1.9,     // độ phóng to khi "soi" một lồng đèn — nhẹ nhàng, vừa đủ đọc
  spotEase:      0.07,    // tốc độ zoom vào/ra (nhỏ = chậm rãi, dịu dàng)

  // — Tốc độ & đường bay —
  speedMin:      0.25,    // bay chậm nhất  (số nhỏ = chậm, thư thái)
  speedMax:      0.60,    // bay nhanh nhất (số to  = nhanh hơn)
  curve:         0.02,    // độ lượn cong  (0.02 nhẹ · 0.04 lượn rõ · 0.06 gắt)

  // — Đung đưa (lắc theo gió) —
  wobbleMin:     6,       // lắc ít nhất  (biên độ, pixel)
  wobbleMax:     16,      // lắc nhiều nhất

  // — Xoay —
  spin:          0.008,   // tốc độ xoay tròn chậm (0 = không xoay)

  // — Kích thước lồng đèn (nhân với lanternPx; giữ ~1 để đồng đều) —
  sizeMin:       0.85,    // nhỏ nhất
  sizeMax:       1.15,    // to nhất

  // — Hiện ra / biến mất —
  fadeInSpeed:   0.05,    // tốc độ hiện ra (số to = hiện nhanh)

  // — Ánh sáng phát quang (glow) —
  glowColor:     'rgba(255,180,80,0.6)',  // màu quầng sáng
  glowSize:      30,      // độ lớn quầng sáng (0 = tắt glow)

  // — Nền trời —
  skyTop:        '#0a0620',  // màu trời phía trên
  skyBottom:     '#241348',  // màu trời phía dưới

  // — Cảnh Trung thu (nền) —
  showMoon:      false,   // hiện mặt trăng + chú Cuội, chị Hằng, thỏ ngọc
  moonScale:     0.68,    // to/nhỏ mặt trăng (1.0 = mặc định)
  moonX:         0.78,    // vị trí ngang mặt trăng (0=trái, 1=phải)
  moonY:         0.28,    // vị trí dọc  (0=trên, 1=dưới)
  showStars:     true,    // sao lấp lánh
  starCount:     90,      // số ngôi sao
  showClouds:    true,    // mây trôi mờ

  edgeMargin:    60,      // cách mép bao nhiêu px thì vòng lại (không sát viền)

  // — Hiệu ứng chào sân —
  confetti:      true,    // pháo giấy khi lồng đèn mới xuất hiện
  confettiCount: 110,     // số mảnh pháo giấy mỗi lần
  sound:         true,    // tiếng "ting" lúc chào sân
  soundVolume:   0.35,    // âm lượng (0–1)

  // — Hiệu ứng điện ảnh (nền) —
  bokeh:         true,    // đốm sáng mờ lơ lửng (chiều sâu)
  bokehCount:    18,
  shootingStars: true,    // sao băng thỉnh thoảng vụt qua
  water:         true,    // mặt nước lung linh + phản chiếu ở đáy màn
  candleFlicker: true,    // ánh nến lập loè bên trong mỗi lồng đèn
  vignette:      true,    // tối nhẹ 4 góc cho chất điện ảnh
};
// ══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// nền ảnh cover + parallax nhẹ tạo cảm giác 3D chiều sâu
const bgImg = new Image(); let bgReady = false;
bgImg.onload = () => { bgReady = true; };
bgImg.src = '/decor/Background.jpeg';
const BG_OVERSCAN = 1.14;   // phóng dư ~14% để có biên khi dịch/parallax
let bgPx = 0, bgPy = 0;     // vị trí con trỏ đã chuẩn hoá [-1..1], làm mượt dần
addEventListener('pointermove', e => {
  bgPx = (e.clientX / innerWidth) * 2 - 1;
  bgPy = (e.clientY / innerHeight) * 2 - 1;
});
function drawBackground(t){
  if (!bgReady) return false;
  const s = Math.max(W / bgImg.width, H / bgImg.height) * BG_OVERSCAN;   // cover + overscan
  const dw = bgImg.width * s, dh = bgImg.height * s;
  const slackX = (dw - W) / 2, slackY = (dh - H) / 2;
  // parallax theo con trỏ + trôi chậm tự động
  const driftX = Math.sin(t * 0.00013) * 0.35, driftY = Math.cos(t * 0.00017) * 0.35;
  const ox = (bgPx * 0.6 + driftX) * slackX;
  const oy = (bgPy * 0.6 + driftY) * slackY;
  ctx.drawImage(bgImg, (W-dw)/2 - ox, (H-dh)/2 - oy, dw, dh);
  return true;
}

const MAX = CONFIG.maxLanterns;
const lanterns = [];
let spotlight = null;     // lantern currently held/zoomed by the operator
const rand = (a, b) => a + Math.random()*(b - a);   // số ngẫu nhiên trong [a,b]

// wrap long wish text onto multiple centred lines
function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(' '); let line='', yy=y;
  for (const w of words){
    const test = line ? line+' '+w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, yy); line=w; yy+=lh; }
    else line=test;
  }
  if (line) ctx.fillText(line, x, yy);
}

// pick the lantern nearest a screen point (within its radius)
function lanternAt(px, py){
  let best=null, bestD=Infinity;
  for (const l of lanterns){
    if (l.leaving || l._r==null) continue;
    const dx=px-l._cx, dy=py-l._cy, d=Math.hypot(dx,dy);
    if (d < Math.max(l._r, 40) && d < bestD){ bestD=d; best=l; }
  }
  return best;
}

// press-and-hold to spotlight; release to let it float again
function spotStart(e){
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  const px = (t.clientX-r.left)*(W/r.width), py=(t.clientY-r.top)*(H/r.height);
  spotlight = lanternAt(px, py);
  if (spotlight) e.preventDefault();
}
function spotEnd(){ spotlight = null; }
addEventListener('pointerdown', spotStart, {passive:false});
addEventListener('pointerup', spotEnd);
addEventListener('pointercancel', spotEnd);
addEventListener('pointerleave', spotEnd);

// normalise every lantern to ~lanternPx regardless of source image size
function fitScale(img){
  return (CONFIG.lanternPx / Math.max(img.width, img.height)) * rand(CONFIG.sizeMin, CONFIG.sizeMax);
}

// release a lantern into the flying sky, DEPTH-model:
//   z = 0  -> nearest, biggest, at its foreground start point
//   z -> 1 -> recedes toward the moon (vanishing point), shrinks & fades out
// The newest lantern is the biggest one up front; older ones have larger z, so
// they trail off small toward the moon — an endless flight into space.
// DEPTH model (flying TOWARD the viewer):
//   z = 1  -> at the moon: tiny, far away (spawn point)
//   z = 0  -> foreground: biggest, nearest
//   z < 0  -> drifts past the viewer and vanishes, then loops back to the moon
// So each lantern is born small at the moon, grows as it floats out to you,
// fades away up close, and reappears from the moon — an endless gentle stream.
// each lantern appears small at a RANDOM point anywhere on screen, then grows
// and drifts a little in its own random direction as it flies toward the viewer,
// before fading out. Far point = random spot; near point = far + a random offset
// (random heading & distance) so they scatter across the whole screen.
function newTrack(){
  const fx = rand(W*0.06, W*0.94), fy = rand(H*0.08, H*0.92);
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.06, Math.min(W,H)*0.22);   // random drift length
  return {
    farX: fx, farY: fy,
    startX: fx + Math.cos(ang)*dist,
    startY: fy + Math.sin(ang)*dist,
  };
}
// track cho LỚP GẦN: quanh vùng trung tâm, biên độ nhỏ -> 5 đèn gần luôn dễ thấy
function newTrackNear(){
  const fx = rand(W*0.22, W*0.78), fy = rand(H*0.22, H*0.72);
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.03, Math.min(W,H)*0.10);
  return { farX: fx, farY: fy, startX: fx + Math.cos(ang)*dist, startY: fy + Math.sin(ang)*dist };
}
const NEAR_MAX = 5;                    // số đèn tối đa ở lớp gần
const Z_NEAR_HI = 0.32, Z_NEAR_LO = -0.05;   // dải z lớp gần
// gán lớp cho 1 đèn: layer 1 (gần, rõ) | 2 (xa, mờ nhẹ)
function assignLayer(l, layer){
  l.layer = layer;
  if (layer === 1){
    Object.assign(l, newTrackNear());
    l.zSpeed = rand(0.00035, 0.00060);         // chậm hơn -> ở gần lâu
    if (l.z == null || l.z > Z_NEAR_HI) l.z = rand(0.06, Z_NEAR_HI);
  } else {
    Object.assign(l, newTrack());
    l.zSpeed = rand(0.00055, 0.00090);
  }
}
// giữ đúng <=5 đèn mới nhất ở lớp gần; dư -> hạ đèn cũ nhất xuống lớp xa
function promoteNewest(){
  const near = lanterns.filter(x=>!x.leaving && x.layer===1).sort((a,b)=>a.born-b.born);
  while (near.length > NEAR_MAX){
    const old = near.shift();
    assignLayer(old, 2);
    old.z = rand(0.4, 0.8);                    // hạ ra xa
  }
}
function releaseToSky(img, name, wish, layer){
  const big = (Math.min(W,H)*0.20 / Math.max(img.width,img.height)) * rand(CONFIG.sizeMin, CONFIG.sizeMax);
  const l = {
    img, name: name || '', wish: wish || '',
    ...newTrack(),
    z: 0.08,
    zSpeed: rand(0.00055, 0.00090),
    phase: Math.random()*Math.PI*2,
    drift: 0.4 + Math.random()*0.5,
    amp: rand(CONFIG.wobbleMin, CONFIG.wobbleMax),
    bigScale: big,
    spot: 0,
    flick: Math.random()*Math.PI*2,
    fade: 1,
    born: performance.now(),
    layer: 1,
  };
  lanterns.push(l);
  assignLayer(l, layer || 1);          // đèn mới mặc định vào lớp gần
  promoteNewest();
  const alive = lanterns.filter(x=>!x.leaving);
  if (alive.length > MAX){
    alive.sort((a,b)=>a.born-b.born);
    alive[0].leaving = true;           // oldest starts fading out
  }
  return l;
}

// add an OLD lantern straight into the sky (no ceremony) — used on page load.
// Spread them across depths so the sky looks already-populated, not all up front.
function addQuiet(rec){
  const img = new Image();
  img.onload = () => {
    releaseToSky(img, rec.name, rec.wish);
    const last = lanterns[lanterns.length-1];
    last.z = Math.random();            // scattered through space (moon → foreground)
    last.phase = Math.random()*Math.PI*2;
  };
  img.src = '/lanterns/' + rec.file;
}

// ── GRAND ENTRANCE queue: new lanterns arrive centre-stage first ──
const entranceQ = [];
let entrance = null;   // {img, name, t0}
const ENTRANCE_MS = 4000;

function enqueueEntrance(rec){
  const img = new Image();
  img.onload = () => entranceQ.push({ img, id: rec.id, name: rec.name || '', wish: rec.wish || '' });
  img.src = '/lanterns/' + rec.file;
}
function pumpEntrance(t){
  if (!entrance && entranceQ.length){
    entrance = entranceQ.shift(); entrance.t0 = t;
    // đèn thực sự vào khung nhìn -> báo server đã xuất hiện (ảnh đã tải, đang hiển thị)
    if (entrance.id != null) socket.emit('lantern-shown', { id: entrance.id });
    if (CONFIG.confetti) burstConfetti(W*0.5, H*0.46);   // pop on arrival
    if (CONFIG.sound)    playTing();
  }
  if (entrance && t - entrance.t0 > ENTRANCE_MS){
    releaseToSky(entrance.img, entrance.name, entrance.wish);   // hand it off to the flying sky
    entrance = null;
  }
}

// ── Confetti (giấy pháo Trung thu) ──
const confetti = [];
const CONFETTI_COLORS = ['#ffd166','#ff8c1a','#e53935','#f06292','#43a047','#57e6ff','#fff6e2'];
function burstConfetti(cx, cy){
  for (let i=0;i<CONFIG.confettiCount;i++){
    const a = Math.random()*Math.PI*2;
    const sp = rand(3, 12);
    confetti.push({
      x: cx, y: cy,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - rand(2,6),      // bias upward
      g: rand(0.12,0.22),                  // gravity
      w: rand(6,12), h: rand(8,16),
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.3,
      color: CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      life: 1
    });
  }
}
function drawConfetti(){
  for (let i=confetti.length-1;i>=0;i--){
    const c = confetti[i];
    c.vy += c.g; c.x += c.vx; c.y += c.vy; c.vx *= 0.99; c.rot += c.vr;
    c.life -= 0.008;
    if (c.life <= 0 || c.y > H+40){ confetti.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, c.life);
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ── Âm thanh "ting" (WebAudio, không cần file) ──
let audioCtx = null;
function playTing(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    // hai nốt chime nhẹ (như chuông gió)
    [ [880, 0], [1320, 0.12] ].forEach(([freq, delay]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(audioCtx.destination);
      const t0 = now + delay;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(CONFIG.soundVolume, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
      osc.start(t0); osc.stop(t0 + 1.2);
    });
  }catch(e){ /* audio blocked until first interaction — see hint below */ }
}
function drawEntrance(t){
  if (!entrance) return;
  const p = (t - entrance.t0) / ENTRANCE_MS;      // 0..1
  // dim the sky a bit so the star of the show pops
  ctx.fillStyle = `rgba(5,3,20,${0.55*Math.min(1,p*3)*(1-Math.max(0,(p-0.8)/0.2))})`;
  ctx.fillRect(0,0,W,H);

  const cx=W*0.5, cy=H*0.46;
  const img = entrance.img;
  // pop-in scale then gentle float
  const grow = p<0.25 ? (p/0.25) : 1;
  const ease = 1 - Math.pow(1-grow, 3);
  const base = Math.min(W,H) * 0.34 / Math.max(img.width,img.height);
  const s = base * (0.2 + 0.8*ease) * (1 + Math.sin(t*0.004)*0.03);
  const iw=img.width*s, ih=img.height*s;

  // radiating light rays
  ctx.save(); ctx.translate(cx,cy);
  ctx.globalAlpha = 0.5*ease*(1-Math.max(0,(p-0.7)/0.3));
  const rot=t*0.0004;
  for(let i=0;i<12;i++){
    ctx.rotate(Math.PI/6 + rot);
    const rg=ctx.createLinearGradient(0,0,0,-Math.max(W,H));
    rg.addColorStop(0,'rgba(255,220,130,0.5)'); rg.addColorStop(1,'rgba(255,220,130,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(30,0); ctx.lineTo(0,-Math.max(W,H)); ctx.fill();
  }
  ctx.restore();

  // glow halo
  const halo=ctx.createRadialGradient(cx,cy,ih*0.2, cx,cy,ih*0.9);
  halo.addColorStop(0,'rgba(255,225,150,0.7)'); halo.addColorStop(1,'rgba(255,225,150,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,ih*0.9,0,Math.PI*2); ctx.fill();

  // the lantern
  ctx.save(); ctx.globalAlpha=1; ctx.translate(cx,cy);
  ctx.shadowColor='rgba(255,190,90,0.9)'; ctx.shadowBlur=40;
  ctx.drawImage(img,-iw/2,-ih/2,iw,ih); ctx.restore();

  // name + caption
  ctx.globalAlpha = Math.min(1,p*4)*(1-Math.max(0,(p-0.8)/0.2));
  ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=12;
  if (entrance.name){
    ctx.fillStyle='#fff'; ctx.font=`700 ${Math.round(Math.min(W,H)*0.06)}px system-ui,sans-serif`;
    ctx.fillText('🏮 ' + entrance.name, cx, cy + ih*0.72);
  }
  ctx.fillStyle='#ffd77a'; ctx.font=`600 ${Math.round(Math.min(W,H)*0.032)}px system-ui,sans-serif`;
  const sub = entrance.wish ? 'gửi một điều ước lên trời…' : 'vừa thả một chiếc lồng đèn!';
  ctx.fillText(sub, cx, cy + ih*0.72 + Math.min(W,H)*0.06);
  // the wish itself, in a soft italic line
  if (entrance.wish){
    ctx.fillStyle='#fff'; ctx.font=`italic 500 ${Math.round(Math.min(W,H)*0.03)}px Georgia, serif`;
    const w = entrance.wish.length>60 ? entrance.wish.slice(0,60)+'…' : entrance.wish;
    ctx.fillText('“'+w+'”', cx, cy + ih*0.72 + Math.min(W,H)*0.104);
  }
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

// load whatever already exists (so restarting the screen doesn't lose the wall).
// stagger their depth EVENLY across the flight so they don't stack on one layer.
// /api/recent trả newest-last -> 5 phần tử CUỐI = mới nhất -> lớp gần, còn lại -> lớp xa
fetch('/api/recent').then(r=>r.json()).then(list => {
  const n = list.length;
  list.forEach((rec, i) => {
    const isNear = i >= n - NEAR_MAX;                 // 5 cuối = mới nhất
    const img = new Image();
    img.onload = () => {
      const l = releaseToSky(img, rec.name, rec.wish, isNear ? 1 : 2);
      if (!isNear){
        l.z = 0.4 + Math.random()*0.55;               // lớp xa: rải sâu 0.4..0.95
      } else {
        l.z = rand(0.08, Z_NEAR_HI);                  // lớp gần
      }
      l.phase = Math.random()*Math.PI*2;
      promoteNewest();
    };
    img.src = '/lanterns/' + rec.file;
  });
});

// browsers block audio until the first user gesture — one click on the screen unlocks it
function unlockAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  const tip = document.getElementById('audioTip');
  if (tip) tip.style.display = 'none';
  window.removeEventListener('click', unlockAudio);
  window.removeEventListener('keydown', unlockAudio);
}

// ── Cảnh nền Trung thu: sao, mây, mặt trăng + Cuội/Hằng/thỏ ─────────
const stars = [];
function seedStars(){
  stars.length = 0;
  for (let i=0;i<CONFIG.starCount;i++)
    stars.push({ x:Math.random(), y:Math.random()*0.7, r:rand(0.6,1.8), tw:rand(0,Math.PI*2), sp:rand(0.5,2) });
}
seedStars();

function drawStars(t){
  for (const s of stars){
    const a = 0.4 + 0.6*Math.abs(Math.sin(t*0.001*s.sp + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ── Bokeh: đốm sáng mờ lơ lửng tạo chiều sâu ──
const bokeh = [];
function seedBokeh(){
  bokeh.length = 0;
  for (let i=0;i<CONFIG.bokehCount;i++)
    bokeh.push({ x:Math.random(), y:Math.random(), r:rand(20,70), sp:rand(0.02,0.08),
                 ph:rand(0,Math.PI*2), hue:rand(35,50) });
}
seedBokeh();
function drawBokeh(t){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for (const b of bokeh){
    const y = ((b.y - t*0.00001*b.sp*8) % 1 + 1) % 1;
    const a = 0.05 + 0.05*Math.sin(t*0.001 + b.ph);
    const g = ctx.createRadialGradient(b.x*W, y*H, 0, b.x*W, y*H, b.r);
    g.addColorStop(0, `hsla(${b.hue},100%,70%,${a})`);
    g.addColorStop(1, 'hsla(45,100%,70%,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x*W, y*H, b.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ── Sao băng: thỉnh thoảng vụt qua ──
const shooters = [];
function maybeShoot(t){
  if (shooters.length < 2 && Math.random() < 0.004){
    const y = rand(0.05,0.4)*H, x = rand(0.1,0.7)*W;
    shooters.push({ x, y, vx: rand(6,10), vy: rand(2,4), life:1, len:rand(120,220) });
  }
  for (let i=shooters.length-1;i>=0;i--){
    const s = shooters[i];
    s.x += s.vx; s.y += s.vy; s.life -= 0.012;
    if (s.life<=0){ shooters.splice(i,1); continue; }
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.len, s.y - s.len*0.35);
    g.addColorStop(0, `rgba(255,255,255,${s.life})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.len, s.y - s.len*0.35); ctx.stroke();
  }
}

// ── Vignette: tối nhẹ 4 góc ──
function drawVignette(){
  const g = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35, W/2,H/2,Math.max(W,H)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

// ── Mặt nước lung linh + phản chiếu ở đáy màn ──
function drawWater(t){
  const wy = H*0.9;                        // waterline (thấp hơn -> bầu trời rộng hơn)
  ctx.save();
  // reflection of the sky/lanterns, flipped & blurred-ish via low alpha bands
  ctx.globalAlpha = 0.22;
  ctx.translate(0, wy*2);
  ctx.scale(1,-1);
  ctx.drawImage(canvas, 0, 0, W, wy, 0, 0, W, wy);   // cheap mirror of top part
  ctx.restore();
  // shimmer mềm — vài quầng sáng loang nhẹ, không kẻ sọc
  ctx.save(); ctx.globalCompositeOperation='screen';
  for (let i=0;i<5;i++){
    const cx = W*(0.15+0.17*i) + Math.sin(t*0.0004 + i)*40;
    const cy = wy + (H-wy)*(0.3+0.14*i);
    const rad = (H-wy)*0.5;
    const a = 0.05 + 0.03*Math.sin(t*0.001 + i*1.3);
    const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,`rgba(255,215,140,${a})`); rg.addColorStop(1,'rgba(255,215,140,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,wy,W,H-wy);
  }
  ctx.restore();
  // dark water tint
  const g = ctx.createLinearGradient(0,wy,0,H);
  g.addColorStop(0,'rgba(10,6,32,0.2)'); g.addColorStop(1,'rgba(10,6,32,0.7)');
  ctx.fillStyle=g; ctx.fillRect(0,wy,W,H-wy);
}

function drawClouds(t){
  const drift = (t*0.008) % (W+400) - 200;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let k=0;k<3;k++){
    const y = H*(0.55 + k*0.13);
    const x = (drift + k*W*0.4) % (W+400) - 200;
    for (let j=0;j<5;j++){
      ctx.beginPath();
      ctx.ellipse(x + j*70, y + Math.sin(j)*10, 60, 26, 0, 0, Math.PI*2); ctx.fill();
    }
  }
}

// silhouette of the banyan tree, Cuội, Hằng and the jade rabbit, drawn INSIDE the moon
function drawMoonScene(cx, cy, R){
  ctx.save();
  // clip to moon disc so the scene stays inside
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  const dark = 'rgba(120,110,70,0.35)';     // soft brown silhouette on the moon
  ctx.fillStyle = dark;
  ctx.strokeStyle = dark;

  const ground = cy + R*0.62;
  // ground line
  ctx.fillRect(cx - R, ground, R*2, R);

  // — Cây đa (banyan tree) on the right —
  const tx = cx + R*0.45;
  ctx.lineWidth = R*0.05;
  ctx.beginPath(); ctx.moveTo(tx, ground); ctx.lineTo(tx, cy - R*0.15); ctx.stroke();
  // hanging roots
  for (let i=-2;i<=2;i++){
    ctx.lineWidth = R*0.015;
    ctx.beginPath(); ctx.moveTo(tx + i*R*0.12, cy - R*0.05);
    ctx.lineTo(tx + i*R*0.12, cy + R*0.2); ctx.stroke();
  }
  // canopy
  for (const [dx,dy,r] of [[0,-0.28,0.26],[-0.2,-0.18,0.2],[0.22,-0.16,0.2],[0.02,-0.42,0.18]]){
    ctx.beginPath(); ctx.arc(tx + dx*R, cy + dy*R, r*R, 0, Math.PI*2); ctx.fill();
  }

  // helper: a little seated/standing person silhouette
  function person(px, py, s, sitting){
    ctx.beginPath(); ctx.arc(px, py - s*1.15, s*0.32, 0, Math.PI*2); ctx.fill();   // head
    ctx.beginPath();
    if (sitting){
      ctx.moveTo(px - s*0.4, py);
      ctx.quadraticCurveTo(px, py - s*1.0, px + s*0.4, py);
      ctx.lineTo(px + s*0.5, py + s*0.15);
      ctx.lineTo(px - s*0.5, py + s*0.15);
    } else {
      ctx.moveTo(px - s*0.32, py + s*0.1);              // flowing robe (Hằng)
      ctx.quadraticCurveTo(px, py - s*1.05, px + s*0.32, py + s*0.1);
      ctx.quadraticCurveTo(px + s*0.15, py + s*0.15, px, py + s*0.12);
      ctx.quadraticCurveTo(px - s*0.15, py + s*0.15, px - s*0.32, py + s*0.1);
    }
    ctx.closePath(); ctx.fill();
  }

  // — Chú Cuội: ngồi dưới gốc cây đa —
  person(tx - R*0.28, ground, R*0.2, true);

  // — Chị Hằng: đứng bên trái, dáng áo dài thướt tha —
  person(cx - R*0.4, ground, R*0.26, false);
  // búi tóc
  ctx.beginPath(); ctx.arc(cx - R*0.4, ground - R*0.34, R*0.06, 0, Math.PI*2); ctx.fill();

  // — Thỏ ngọc: cạnh chân chị Hằng, đang giã thuốc —
  const rx = cx - R*0.12, ry = ground - R*0.02;
  ctx.beginPath(); ctx.ellipse(rx, ry, R*0.09, R*0.13, 0, 0, Math.PI*2); ctx.fill();  // body
  ctx.beginPath(); ctx.arc(rx, ry - R*0.14, R*0.055, 0, Math.PI*2); ctx.fill();       // head
  // hai tai
  ctx.lineWidth = R*0.02;
  ctx.beginPath(); ctx.moveTo(rx, ry - R*0.18); ctx.lineTo(rx - R*0.02, ry - R*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx + R*0.02, ry - R*0.18); ctx.lineTo(rx + R*0.04, ry - R*0.3); ctx.stroke();
  // cối giã thuốc
  ctx.fillRect(rx + R*0.1, ry, R*0.06, R*0.08);

  ctx.restore();
}

function drawMoon(t){
  const R = Math.min(W,H) * 0.16 * CONFIG.moonScale;
  const cx = W*CONFIG.moonX, cy = H*CONFIG.moonY;
  // outer glow halo
  const halo = ctx.createRadialGradient(cx,cy,R*0.6, cx,cy,R*2.2);
  halo.addColorStop(0,'rgba(255,240,200,0.55)');
  halo.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(cx,cy,R*2.2,0,Math.PI*2); ctx.fill();
  // moon disc
  const disc = ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.2, cx,cy,R);
  disc.addColorStop(0,'#fff8e6'); disc.addColorStop(1,'#ffdf9e');
  ctx.fillStyle = disc;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  // the legend, inside the moon
  drawMoonScene(cx, cy, R);
}

function frame(t){
  ctx.clearRect(0,0,W,H);
  // nền: ảnh cover + parallax 3D nếu tải xong, chưa thì gradient trời
  if (drawBackground(t)){
    // vignette tối viền -> tăng chiều sâu, nền lún vào trong
    const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3, W/2,H/2,Math.max(W,H)*0.7);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(4,2,16,0.55)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  } else {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,CONFIG.skyTop); g.addColorStop(1,CONFIG.skyBottom);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  if (CONFIG.showStars)     drawStars(t);
  if (CONFIG.shootingStars) maybeShoot(t);
  if (CONFIG.bokeh)         drawBokeh(t);
  if (CONFIG.showClouds)    drawClouds(t);
  if (CONFIG.showMoon)      drawMoon(t);

  // draw far → near so nearer (bigger) lanterns overlap on top.
  // far = large z (near the moon); sort descending so near ones draw last.
  const order = lanterns.map((l,i)=>({l,i})).sort((a,b)=> b.l.z - a.l.z);
  for (const {l, i} of order){
    const isSpot = (l === spotlight);
    l.spot = (l.spot||0) + ((isSpot?1:0) - (l.spot||0)) * CONFIG.spotEase;

    // drift OUT toward the viewer: z decreases (spotlighted one nearly pauses)
    if (!isSpot) l.z -= l.zSpeed * (1 - l.spot*0.96);
    if (l.layer === 1){
      // LỚP GẦN: quẩn trong dải gần, không lùi về mặt trăng
      if (l.z <= Z_NEAR_LO){
        if (l.leaving){ l._dead = true; }
        else { l.z = Z_NEAR_HI; Object.assign(l, newTrackNear()); l.phase = Math.random()*Math.PI*2; }
      }
    } else {
      // LỚP XA: bay từ mặt trăng ra rồi loop lại
      if (l.z <= -0.28){
        if (l.leaving){ l._dead = true; }
        else { l.z = 1; Object.assign(l, newTrack()); l.phase = Math.random()*Math.PI*2; }
      }
    }
    l.phase += 0.02*l.drift;

    // perspective: pp grows as z shrinks. z=1(moon)→~0 tiny; z=0→1; z<0→>1 huge.
    const pp = Math.max(0, 1 - l.z);
    // lerp this lantern's OWN far point → OWN near point as it flies out (t: 0..1)
    const t01 = 1 - l.z;
    const fx = (l.farX!=null?l.farX:vpX()), fy = (l.farY!=null?l.farY:vpY());
    const cx = fx + (l.startX - fx)*t01 + Math.sin(l.phase)*l.amp*pp*(1-l.spot);
    const cy = fy + (l.startY - fy)*t01 + Math.cos(l.phase*0.8)*l.amp*0.5*pp*(1-l.spot);

    // alpha khác nhau theo lớp
    let alpha;
    if (l.layer === 1){
      // LỚP GẦN: sáng rõ hẳn, không làm mờ theo chiều sâu; chỉ fade nhẹ ở 2 mép dải gần
      const vanishN = Math.min(1, Math.max(0, (l.z - Z_NEAR_LO)/0.10));   // mờ dần khi sắp qua viewer
      alpha = Math.max(0, Math.min(1, vanishN * l.fade));
    } else {
      const appear = Math.min(1, (1 - l.z)/0.12);        // 0 at moon → 1 shortly after
      const vanish = Math.min(1, Math.max(0, (l.z + 0.28)/0.30));  // 1 until z<0 → 0 at -0.28
      const depthDim = 0.35 + 0.65*pp;                    // đèn xa mờ hơn
      alpha = Math.max(0, Math.min(1, appear * vanish * depthDim * l.fade));
    }

    const zoom = 1 + l.spot*(CONFIG.spotZoom-1);
    const scale = l.bigScale * pp * zoom;
    const iw = l.img.width*scale, ih = l.img.height*scale;
    // hit-testing footprint
    l._cx = cx; l._cy = cy; l._r = Math.max(l.img.width,l.img.height)*scale*0.5;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(cx, cy);
    ctx.rotate(Math.sin(l.phase)*0.05*(1-l.spot));
    const nearBoost = (l.layer === 1) ? 1.7 : 1;      // lớp gần: quầng sáng mạnh hơn
    if (CONFIG.candleFlicker && ih > 8){
      l.flick += 0.15 + Math.random()*0.1;
      const fl = 0.6 + 0.4*Math.sin(l.flick) + (Math.random()-0.5)*0.15;
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const gl = ctx.createRadialGradient(0,0,0, 0,0,ih*0.6);
      gl.addColorStop(0, `rgba(255,190,90,${Math.min(1,(0.35+l.spot*0.4)*fl*alpha*nearBoost)})`);
      gl.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(0,0,ih*0.6,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.shadowColor = CONFIG.glowColor; ctx.shadowBlur = (CONFIG.glowSize + l.spot*30)*pp*nearBoost;
    ctx.drawImage(l.img, -iw/2, -ih/2, iw, ih);
    ctx.restore();

    // name tag under the lantern — only while reasonably near (readable)
    if (CONFIG.showNames && l.name && l.spot < 0.5 && pp > 0.45){
      ctx.save();
      ctx.globalAlpha = alpha*0.9;
      ctx.translate(cx, cy + ih*0.62);
      ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=6;
      // tên (to, đậm)
      const nameSize = Math.max(12, Math.round(ih*0.13));
      ctx.font=`700 ${nameSize}px system-ui,sans-serif`;
      ctx.fillStyle='#ffe9b0';
      ctx.fillText(l.name, 0, 0);
      // câu chúc trong ngoặc kép, chữ nhỏ hơn tên
      if (l.wish){
        ctx.font=`italic 500 ${Math.round(nameSize*0.72)}px Georgia,serif`;
        ctx.fillStyle='#c9bfff';
        ctx.fillText('“'+l.wish+'”', 0, nameSize*1.15);
      }
      ctx.restore();
    }

    // spotlight card: big name + wish
    if (l.spot > 0.02){
      ctx.save();
      ctx.globalAlpha = l.spot;
      ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,0.75)'; ctx.shadowBlur=14;
      const nameY = cy + ih*0.60;
      if (l.name){
        ctx.fillStyle='#fff'; ctx.font=`800 ${Math.round(Math.min(W,H)*0.045)}px system-ui,sans-serif`;
        ctx.fillText('🏮 ' + l.name, cx, nameY);
      }
      if (l.wish){
        ctx.fillStyle='#ffe9b0'; ctx.font=`italic 500 ${Math.round(Math.min(W,H)*0.032)}px Georgia,serif`;
        wrapText(ctx, '“'+l.wish+'”', cx, nameY + Math.min(W,H)*0.055, Math.min(W*0.7,560), Math.min(W,H)*0.042);
      }
      ctx.restore();
    }
  }

  // remove lanterns flagged dead (leaving ones that have passed the viewer)
  for (let i=lanterns.length-1;i>=0;i--){
    if (lanterns[i]._dead) lanterns.splice(i,1);
  }

  if (CONFIG.water) drawWater(t);

  // grand entrance sits on TOP of the flying sky
  pumpEntrance(t);
  drawEntrance(t);
  drawConfetti();

  if (CONFIG.vignette) drawVignette();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
