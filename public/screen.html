<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bầu trời lồng đèn</title>
<style>
  @font-face{ font-family:'Be Vietnam Pro'; font-style:normal; font-weight:400; font-display:swap; src:url('/fonts/bvp-400.woff2') format('woff2'); }
  @font-face{ font-family:'Be Vietnam Pro'; font-style:normal; font-weight:700; font-display:swap; src:url('/fonts/bvp-700.woff2') format('woff2'); }
  @font-face{ font-family:'Be Vietnam Pro'; font-style:normal; font-weight:800; font-display:swap; src:url('/fonts/bvp-800.woff2') format('woff2'); }
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0620;font-family:'Be Vietnam Pro',system-ui,sans-serif;}
  /* Nền + vignette = lớp DOM (compositor GPU) — không vẽ lại mỗi frame. */
  #bgLayer{ position:fixed; inset:0; z-index:0;
    background:url('/decor/bg-galaxy.jpeg') center/cover no-repeat #0a0620; }
  #bgVig{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(4,2,16,0.55) 100%); }
  #frameVig{ position:fixed; inset:0; z-index:50; pointer-events:none;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }

  /* Sân khấu chứa đèn. Mỗi đèn di chuyển CHỈ bằng transform (không layout, không repaint). */
  #stage{ position:fixed; inset:0; z-index:2; }
  .lantern{ position:absolute; left:0; top:0; will-change:transform,opacity;
            transform-origin:50% 50%; pointer-events:auto; }
  /* Quầng sáng: radial-gradient MỀM sẵn (không dùng filter:blur -> tránh CPU).
     Nhấp nháy nến = animate opacity (compositor). */
  .lantern .glow{ position:absolute; left:50%; top:50%; width:200%; height:200%;
     transform:translate(-50%,-50%); pointer-events:none; z-index:-1;
     background:radial-gradient(circle, rgba(255,190,90,0.9) 0%, rgba(255,175,80,0.45) 38%, rgba(255,140,30,0) 70%);
     animation:flick 2.4s ease-in-out infinite; }
  .lantern img{ display:block; width:100%; height:auto; }
  .lantern .cap{ position:absolute; left:50%; top:100%; transform:translateX(-50%);
     text-align:center; line-height:1.25; text-shadow:0 2px 8px #000c; white-space:nowrap; margin-top:4px; }
  .lantern .nm{ font:700 15px 'Be Vietnam Pro',system-ui,sans-serif; color:#ffe9b0; }
  .lantern .ws{ font:italic 500 13px Georgia,serif; color:#e9e0ff; }
  @keyframes flick{ 0%,100%{opacity:.55} 45%{opacity:1} 70%{opacity:.72} }

  #audioTip{ position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:56;
             background:#8a1a12cc; color:#ffe9b0; border:1px solid #ffd77a; border-radius:20px;
             padding:8px 16px; font:600 14px system-ui,sans-serif; box-shadow:0 4px 16px #0007; }

  #fsBtn{ position:fixed; right:18px; top:18px; z-index:60;
          background:#1a0f3ccc; color:#ffe9b0; border:1px solid #ffd77a; border-radius:20px;
          padding:8px 14px; font:600 14px system-ui,sans-serif; cursor:pointer; box-shadow:0 4px 16px #0007; transition:opacity .4s; }
  #fsBtn:hover{ opacity:1 !important; }

  /* dòng đếm số lồng đèn — góc DƯỚI trái, phát sáng nhịp nhàng */
  #countBar{ position:fixed; left:50%; transform:translateX(-50%); bottom:26px; z-index:55;
     font-family:'Be Vietnam Pro',system-ui,sans-serif; font-weight:800; font-size:22px;
     line-height:1.3; letter-spacing:.3px; text-align:center; pointer-events:none;
     color:#ffe9b0; text-shadow:0 2px 10px #000a; animation:countGlow 2.6s ease-in-out infinite; }
  #countBar b{ font-size:30px; font-weight:800;
     background:linear-gradient(180deg,#fff2c0,#ffcf6a 45%,#ff9a1a);
     -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
     filter:drop-shadow(0 0 10px #ffb43a88); }
  @keyframes countGlow{ 0%,100%{ text-shadow:0 2px 10px #000a, 0 0 14px #ffb43a44; opacity:.94 }
    50%{ text-shadow:0 2px 10px #000a, 0 0 26px #ffb43a99; opacity:1 } }

  /* Lồng đèn VML góc trái-trên — treo lơ lửng, sáng nhấp nháy.
     Hào quang = lớp gradient phía sau + animate OPACITY (compositor GPU),
     KHÔNG dùng filter:drop-shadow động (blur mỗi frame trên CPU -> lag TV). */
  #vmlLantern{ position:fixed; left:30px; top:24px; z-index:55; width:15vh; max-width:150px;
    pointer-events:none; transform-origin:50% 8%;
    animation:vmlSway 4.6s ease-in-out infinite; }
  #vmlLantern::before{ content:''; position:absolute; left:50%; top:42%;
    width:220%; height:220%; transform:translate(-50%,-50%); z-index:-1; pointer-events:none;
    background:radial-gradient(circle, rgba(255,200,110,0.85) 0%, rgba(255,150,50,0.4) 40%, rgba(255,120,20,0) 70%);
    animation:vmlGlow 2s ease-in-out infinite; }
  #vmlLantern img{ display:block; width:100%; height:auto; }
  @keyframes vmlSway{ 0%,100%{ transform:rotate(-2.5deg) translateY(0) } 50%{ transform:rotate(2.5deg) translateY(-6px) } }
  @keyframes vmlGlow{
    0%,100%{ opacity:.7;  transform:translate(-50%,-50%) scale(0.95) }
    30%    { opacity:1;   transform:translate(-50%,-50%) scale(1.08) }
    48%    { opacity:.82; transform:translate(-50%,-50%) scale(1.0)  }
    68%    { opacity:1;   transform:translate(-50%,-50%) scale(1.12) }
    84%    { opacity:.88; transform:translate(-50%,-50%) scale(1.03) }
  }

  /* QR góc phải dưới — khung tre (QR đã in sẵn trong ảnh) */
  #qrCard{ position:fixed; left:48px; bottom:60px; z-index:55; width:220px;
           text-align:center; font-family:system-ui,sans-serif; }
  #qrLantern{ position:relative; width:220px; height:220px; margin:0 auto;
    background:url('/decor/qr-cube-right.png') center/contain no-repeat; }
  #qrLantern::before{ content:''; position:absolute; left:50%; top:50%;
    width:170%; height:170%; transform:translate(-50%,-50%); z-index:-1; pointer-events:none;
    background:radial-gradient(circle, rgba(255,200,110,0.8) 0%, rgba(255,150,50,0.38) 40%, rgba(255,120,20,0) 70%);
    animation:vmlGlow 2s ease-in-out infinite; }
  #qrCard .tt{ color:#fff; font-weight:700; font-size:15px; margin-top:-6px; letter-spacing:.2px; white-space:nowrap;
    text-shadow:0 2px 8px #000a; }

  /* ── Grand entrance: đèn mới hiện giữa màn ~3.5s rồi nhập bầu trời.
     TẤT CẢ bằng CSS transform+opacity (compositor GPU) — không blur, JS không
     vẽ mỗi frame -> không lag như bản canvas cũ. ── */
  #entrance{ position:fixed; inset:0; z-index:40; pointer-events:none;
    display:none; align-items:center; justify-content:center; }
  #entrance.show{ display:flex; }
  #entDim{ position:absolute; inset:0; background:rgba(5,3,20,0.55);
    opacity:0; animation:entDim 6.5s ease-in-out forwards; }
  #entStage{ position:relative; display:flex; flex-direction:column; align-items:center; }
  /* tia sáng tỏa: conic-gradient nan quạt, xoay bằng transform (không blur) */
  #entRays{ position:absolute; left:50%; top:0; width:120vh; height:120vh;
    transform:translate(-50%,-50%); z-index:-2; opacity:0;
    background:conic-gradient(from 0deg,
      rgba(255,220,130,0) 0deg, rgba(255,220,130,.28) 6deg, rgba(255,220,130,0) 12deg,
      rgba(255,220,130,0) 18deg, rgba(255,220,130,.28) 24deg, rgba(255,220,130,0) 30deg,
      rgba(255,220,130,0) 36deg, rgba(255,220,130,.28) 42deg, rgba(255,220,130,0) 48deg,
      rgba(255,220,130,0) 54deg, rgba(255,220,130,.28) 60deg, rgba(255,220,130,0) 66deg,
      rgba(255,220,130,0) 72deg, rgba(255,220,130,.28) 78deg, rgba(255,220,130,0) 84deg,
      rgba(255,220,130,0) 90deg, rgba(255,220,130,.28) 96deg, rgba(255,220,130,0) 102deg,
      rgba(255,220,130,0) 108deg,rgba(255,220,130,.28) 114deg,rgba(255,220,130,0) 120deg,
      rgba(255,220,130,0) 126deg,rgba(255,220,130,.28) 132deg,rgba(255,220,130,0) 138deg,
      rgba(255,220,130,0) 144deg,rgba(255,220,130,.28) 150deg,rgba(255,220,130,0) 156deg,
      rgba(255,220,130,0) 162deg,rgba(255,220,130,.28) 168deg,rgba(255,220,130,0) 174deg,
      rgba(255,220,130,0) 180deg,rgba(255,220,130,.28) 186deg,rgba(255,220,130,0) 192deg,
      rgba(255,220,130,0) 300deg,rgba(255,220,130,.28) 306deg,rgba(255,220,130,0) 312deg,
      rgba(255,220,130,0) 360deg);
    -webkit-mask:radial-gradient(circle, #000 0%, #000 12%, transparent 60%);
            mask:radial-gradient(circle, #000 0%, #000 12%, transparent 60%);
    animation:entRays 6.5s ease-in-out forwards; }
  #entGlow{ position:absolute; left:50%; top:0; width:60vh; height:60vh;
    transform:translate(-50%,-50%); z-index:-1; opacity:0;
    background:radial-gradient(circle, rgba(255,225,150,0.75) 0%, rgba(255,190,90,0.35) 40%, rgba(255,160,60,0) 70%);
    animation:entGlow 6.5s ease-in-out forwards; }
  #entImg{ height:34vh; width:auto; display:block; transform:scale(0.2); opacity:0;
    animation:entPop 6.5s cubic-bezier(.16,1,.3,1) forwards; }
  #entName{ margin-top:2vh; text-align:center; opacity:0; animation:entText 6.5s ease-out forwards; }
  #entName .nm{ font:800 4.2vh 'Be Vietnam Pro',system-ui,sans-serif; color:#fff; text-shadow:0 2px 12px #000a; }
  #entName .sub{ font:600 2.2vh 'Be Vietnam Pro',system-ui,sans-serif; color:#ffd77a; margin-top:.6vh; }
  #entName .ws{ font:italic 500 2.4vh Georgia,serif; color:#fff; margin-top:.6vh; text-shadow:0 2px 10px #000a; }
  @keyframes entDim{ 0%{opacity:0} 6.5%{opacity:1} 89%{opacity:1} 100%{opacity:0} }
  @keyframes entRays{ 0%{opacity:0; transform:translate(-50%,-50%) rotate(0deg)}
    14%{opacity:.5} 78%{opacity:.4} 100%{opacity:0; transform:translate(-50%,-50%) rotate(60deg)} }
  @keyframes entGlow{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.6)}
    13.5%{opacity:1; transform:translate(-50%,-50%) scale(1)} 89%{opacity:.9} 100%{opacity:0} }
  @keyframes entPop{ 0%{opacity:0; transform:scale(.2)} 9.7%{opacity:1; transform:scale(1.06)}
    15%{transform:scale(1)} 89%{opacity:1; transform:scale(1.02)} 100%{opacity:0; transform:scale(1.05)} }
  @keyframes entText{ 0%{opacity:0} 10.8%{opacity:0} 18.3%{opacity:1} 90%{opacity:1} 100%{opacity:0} }

  /* Bảng đo hiệu năng — chỉ hiện khi /screen?fps=1 */
  #perfPanel{ display:none; position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:70;
     background:#0a0620dd; color:#ffe9b0; border:1px solid #ffd77a; border-radius:14px; padding:10px 14px;
     font:600 14px system-ui,sans-serif; box-shadow:0 4px 16px #0009; text-align:center; }
  #fpsReadout{ font-size:22px; font-weight:800; margin-bottom:6px; }
  #maxButtons{ display:flex; gap:6px; justify-content:center; }
  #maxButtons button{ background:#1a0f3c; color:#ffe9b0; border:1px solid #ffd77a; border-radius:10px;
     padding:6px 12px; font:700 14px system-ui,sans-serif; cursor:pointer; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgVig"></div>
<div id="stage"></div>
<div id="frameVig"></div>

<div id="audioTip">🔊 Chạm một lần để bật âm thanh</div>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
<div id="countBar">Đã có <b id="countN">…</b> lồng đèn<br>được thả tại VML Việt Nam</div>

<!-- Lồng đèn VML góc trái-trên -->
<div id="vmlLantern"><img src="/decor/vml-lantern.png" alt="Lồng đèn VML"></div>

<!-- QR góc phải dưới -->
<div id="qrCard">
  <div id="qrLantern"></div>
  <div class="tt">Scan để tạo lồng đèn</div>
</div>

<!-- Grand entrance đèn mới (CSS thuần) -->
<div id="entrance">
  <div id="entDim"></div>
  <div id="entStage">
    <div id="entRays"></div>
    <div id="entGlow"></div>
    <img id="entImg" alt="">
    <div id="entName"></div>
  </div>
</div>

<div id="perfPanel">
  <div id="fpsReadout">-- fps</div>
  <div id="maxButtons"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  BẢN DOM (bỏ canvas): mỗi lồng đèn là 1 phần tử DOM, di chuyển CHỈ bằng
//  transform + opacity -> chạy trên compositor GPU (mượt trên TV yếu).
//  KHÔNG dùng filter/blur cho đèn. Nền + vignette là lớp DOM tĩnh.
// ══════════════════════════════════════════════════════════════════
const CONFIG = {
  maxLanterns: 80,
  lanternVh:   0.20,   // đường kính đèn lớp gần ~ 20% chiều nhỏ màn
  showNames:   true,
  spotZoom:    1.9,
  spotEase:    0.10,
  wobbleMin:   6, wobbleMax: 16,
  sizeMin:     0.85, sizeMax: 1.15,
};

let W = innerWidth, H = innerHeight;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; });

const stage = document.getElementById('stage');
const rand = (a,b) => a + Math.random()*(b-a);

// ── #3 Throttle ~30fps: cảnh trôi chậm, 30 vs 60 mắt không phân biệt, nhẹ 1/2 việc
const STEP_MS = 1000/30;
let _lastStep = 0;

// ── Giới hạn HIỂN THỊ đồng thời: tối đa 100 đèn trên màn. Nếu pool đông hơn,
// ẩn bớt NGẪU NHIÊN số dư; định kỳ XOAY VÒNG — đèn đang ẩn hiện lại, đèn khác
// ẩn thay. Đèn 'nghỉ' được tạm dừng (không tiến z) nên hiện lại đúng chỗ cũ.
const DISPLAY_CAP = 80;       // số đèn tối đa hiển thị cùng lúc
const ROTATE_MS = 9000;       // mỗi 9s đổi lượt đèn ẩn/hiện
let _lastRotate = 0;
function rotateVisibility(t){
  if (t - _lastRotate < ROTATE_MS) return;
  _lastRotate = t;
  const alive = lanterns.filter(x=>!x.leaving);
  for (const l of alive) l.rest = false;            // đánh thức tất cả trước
  const over = alive.length - DISPLAY_CAP;
  if (over <= 0) return;
  // xáo trộn Fisher–Yates rồi chọn `over` đèn cho nghỉ đợt này
  for (let i=alive.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=alive[i]; alive[i]=alive[j]; alive[j]=tmp; }
  for (let i=0;i<over;i++) alive[i].rest = true;
}

// ── #1 Thu nhỏ ảnh khi ĐÔNG: giảm bộ nhớ/băng thông texture của TV yếu.
// Thang bậc theo số đèn — càng đông càng nhỏ (đèn đông phần lớn ở xa, hiện
// rất nhỏ nên hạ texture không ảnh hưởng mắt nhìn):
//   <40 gốc · >=40 160px · >=80 100px · >=120 80px · >=160 64px · >=200 52px
// Trả 0 = giữ ảnh gốc. Downscale 1 lần/(src+size), cache theo cả kích thước.
function targetMax(){
  const n = lanterns.filter(x=>!x.leaving).length;
  if (n >= 200) return 52;
  if (n >= 160) return 64;
  if (n >= 120) return 80;
  if (n >= 80)  return 100;
  if (n >= 40)  return 160;
  return 0;
}

// ── Zoom-out theo mật độ: càng đông -> mỗi đèn hiển thị nhỏ lại để có chỗ cho
// nhiều đèn hơn. Hệ số toàn cục, nội suy 1.0 (ít) -> CROWD_MIN (đông), làm mượt.
const CROWD_LO = 40, CROWD_HI = 200;
const CROWD_MIN = 0.5;
let crowdScale = 1;
function targetCrowdScale(){
  const n = lanterns.filter(x=>!x.leaving).length;
  const f = Math.max(0, Math.min(1, (n - CROWD_LO)/(CROWD_HI - CROWD_LO)));
  return 1 - (1 - CROWD_MIN)*f;
}
const _smallCache = new Map();  // 'src@max' -> dataURL nhỏ
function makeSmall(fullSrc, max, cb){
  const key = fullSrc + '@' + max;
  const cached = _smallCache.get(key);
  if (cached){ cb(cached); return; }
  const im = new Image();
  im.onload = () => {
    const s = Math.min(1, max/Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width*s));
    c.height = Math.max(1, Math.round(im.height*s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    let url; try { url = c.toDataURL('image/png'); } catch(e){ url = fullSrc; }
    _smallCache.set(key, url); cb(url);
  };
  im.onerror = () => cb(fullSrc);
  im.src = fullSrc;
}
function setLanternSrc(dom, fullSrc){
  const max = targetMax();
  if (max) makeSmall(fullSrc, max, u => { dom.img.src = u; });
  else dom.img.src = fullSrc;
}

// ── #2 Rải tránh chụm: best-candidate — thử vài điểm, giữ điểm cách xa các đèn
// hiện có nhất -> tản đều, ít đè lên nhau.
function bestFar(xMin, xMax, yMin, yMax){
  let best = null, bestD = -1;
  for (let k=0; k<6; k++){
    const x = rand(xMin, xMax), y = rand(yMin, yMax);
    let d = Infinity;
    for (const o of lanterns){
      if (o.leaving || o.farX == null) continue;
      const dx = x-o.farX, dy = y-o.farY, dd = dx*dx + dy*dy;
      if (dd < d) d = dd;
    }
    if (d > bestD){ bestD = d; best = {x, y}; }
  }
  return best;
}

// Nền là ảnh tĩnh (CSS #bgLayer) — không parallax, không cập nhật mỗi frame.

// ── Mô hình bay ──
let MAX = CONFIG.maxLanterns;
const lanterns = [];
let spotlight = null;

function newTrack(){
  const p = bestFar(W*0.06, W*0.94, H*0.08, H*0.92);
  const fx = p.x, fy = p.y;
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.06, Math.min(W,H)*0.22);
  return { farX:fx, farY:fy, startX:fx+Math.cos(ang)*dist, startY:fy+Math.sin(ang)*dist };
}
function newTrackNear(){
  const p = bestFar(W*0.22, W*0.78, H*0.22, H*0.72);
  const fx = p.x, fy = p.y;
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.03, Math.min(W,H)*0.10);
  return { farX:fx, farY:fy, startX:fx+Math.cos(ang)*dist, startY:fy+Math.sin(ang)*dist };
}
const NEAR_MAX = 5, Z_NEAR_HI = 0.32, Z_NEAR_LO = -0.05;
function assignLayer(l, layer){
  l.layer = layer;
  if (layer === 1){
    Object.assign(l, newTrackNear());
    l.zSpeed = rand(0.00035, 0.00060);
    if (l.z == null || l.z > Z_NEAR_HI) l.z = rand(0.06, Z_NEAR_HI);
  } else {
    Object.assign(l, newTrack());
    l.zSpeed = rand(0.00055, 0.00090);
  }
}
function promoteNewest(){
  const near = lanterns.filter(x=>!x.leaving && x.layer===1).sort((a,b)=>a.born-b.born);
  while (near.length > NEAR_MAX){ const old = near.shift(); assignLayer(old,2); old.z = rand(0.4,0.8); }
}

function makeEl(name, wish){
  const el = document.createElement('div'); el.className = 'lantern';
  const glow = document.createElement('div'); glow.className = 'glow';
  glow.style.animationDelay = (-Math.random()*2.4).toFixed(2)+'s';
  const img = document.createElement('img');
  el.appendChild(glow); el.appendChild(img);
  if (CONFIG.showNames && (name||wish)){
    const cap = document.createElement('div'); cap.className='cap';
    if (name){ const nm = document.createElement('div'); nm.className='nm'; nm.textContent = name; cap.appendChild(nm); }
    if (wish){ const ws = document.createElement('div'); ws.className='ws'; ws.textContent = '“'+wish+'”'; cap.appendChild(ws); }
    el.appendChild(cap);
  }
  stage.appendChild(el);
  return { el, img, glow };
}

function releaseToSky(src, name, wish, layer){
  const dom = makeEl(name, wish);
  dom.fullSrc = src;
  setLanternSrc(dom, src);
  const l = {
    ...dom, name:name||'', wish:wish||'',
    ...newTrack(), z:0.08, zSpeed:rand(0.00055,0.00090),
    phase:Math.random()*Math.PI*2, drift:0.4+Math.random()*0.5,
    amp:rand(CONFIG.wobbleMin,CONFIG.wobbleMax),
    sizePx: (Math.min(W,H)*CONFIG.lanternVh)*rand(CONFIG.sizeMin,CONFIG.sizeMax),
    spot:0, born:performance.now(), layer:1,
  };
  lanterns.push(l);
  assignLayer(l, layer||1);
  promoteNewest();
  const alive = lanterns.filter(x=>!x.leaving);
  if (alive.length > MAX){ alive.sort((a,b)=>a.born-b.born); alive[0].leaving = true; }
  return l;
}

function removeLantern(l){ if (l.el && l.el.parentNode) l.el.remove(); }

function setMaxLanterns(n){
  MAX = n;
  const alive = lanterns.filter(x=>!x.leaving);
  if (alive.length > MAX){
    alive.sort((a,b)=>a.born-b.born);
    for (let i=0;i<alive.length-MAX;i++) alive[i].leaving = true;
  } else {
    const pool = alive.filter(l=>l.fullSrc);
    if (!pool.length) return;
    for (let i=alive.length;i<MAX;i++){
      const s = pool[(Math.random()*pool.length)|0];
      const l = releaseToSky(s.fullSrc, s.name, s.wish, 2);
      l.z = Math.random(); l.phase = Math.random()*Math.PI*2;
    }
  }
}

// ── Spotlight: chạm/giữ để phóng to đèn gần con trỏ ──
function lanternAtPoint(px, py){
  const elem = document.elementFromPoint(px, py);
  if (!elem) return null;
  const wrap = elem.closest('.lantern');
  if (!wrap) return null;
  return lanterns.find(l => l.el === wrap && !l.leaving) || null;
}
addEventListener('pointerdown', e => { spotlight = lanternAtPoint(e.clientX, e.clientY); }, {passive:true});
addEventListener('pointerup', () => spotlight = null);
addEventListener('pointercancel', () => spotlight = null);

// ── Vòng lặp: CHỈ ghi transform + opacity ──
function frame(t){
  requestAnimationFrame(frame);
  if (t - _lastStep < STEP_MS) return;   // #3: giới hạn ~30fps
  _lastStep = t;
  fpsTick(t);
  rotateVisibility(t);   // xoay vòng đèn ẩn/hiện khi pool > DISPLAY_CAP
  crowdScale += (targetCrowdScale() - crowdScale) * 0.05;   // zoom-out theo mật độ, làm mượt

  for (let i=lanterns.length-1; i>=0; i--){
    const l = lanterns[i];
    // đèn đang 'nghỉ': fade-out mượt rồi tạm dừng (không tiến z) -> fade-in lại đúng chỗ cũ
    const restResting = l.rest && !l.leaving;
    if (l.restA == null) l.restA = 1;
    l.restA += ((restResting ? 0 : 1) - l.restA) * 0.03;
    // đã mờ hẳn -> ẩn để compositor bỏ qua lớp, giữ nguyên vị trí
    if (restResting && l.restA < 0.02){
      if (!l._hidden){ l.el.style.visibility = 'hidden'; l._hidden = true; }
      continue;
    }
    // đèn 'leaving': fade-out tại chỗ cho hết rồi mới xóa -> không pop đột ngột
    if (l.leaving && l._fade != null && l._fade <= 0.02){ removeLantern(l); lanterns.splice(i,1); continue; }
    const isSpot = (l === spotlight);
    l.spot += ((isSpot?1:0) - l.spot) * CONFIG.spotEase;

    if (!isSpot && !restResting && !l.leaving) l.z -= l.zSpeed * (1 - l.spot*0.96);

    if (l.layer === 1){
      if (l.z <= Z_NEAR_LO){
        l.z = Z_NEAR_HI; Object.assign(l, newTrackNear()); l.phase = Math.random()*Math.PI*2;
      }
    } else {
      if (l.z <= -0.28){
        l.z = 1; Object.assign(l, newTrack()); l.phase = Math.random()*Math.PI*2;
      }
    }
    l.phase += 0.02*l.drift;

    const pp = Math.max(0, 1 - l.z);
    const t01 = 1 - l.z;
    const cx = l.farX + (l.startX-l.farX)*t01 + Math.sin(l.phase)*l.amp*pp*(1-l.spot);
    const cy = l.farY + (l.startY-l.farY)*t01 + Math.cos(l.phase*0.8)*l.amp*0.5*pp*(1-l.spot);

    let alpha;
    if (l.layer === 1){
      const vanishN = Math.min(1, Math.max(0, (l.z - Z_NEAR_LO)/0.10));
      alpha = Math.max(0, Math.min(1, vanishN * l.restA * (l.leaving?fadeMul(l):1)));
    } else {
      const appear = Math.min(1, (1 - l.z)/0.12);
      const vanish = Math.min(1, Math.max(0, (l.z + 0.28)/0.30));
      const depthDim = 0.5 + 0.5*pp;
      alpha = Math.max(0, Math.min(1, appear * vanish * depthDim * l.restA * (l.leaving?fadeMul(l):1)));
    }

    const zoom = 1 + l.spot*(CONFIG.spotZoom-1);
    const crowd = crowdScale + (1 - crowdScale)*l.spot;   // đèn đang soi miễn zoom-out
    const px = l.sizePx * pp * zoom * crowd;
    const scale = px / l.sizePx;
    const rot = Math.sin(l.phase)*0.05*(1-l.spot);

    if (l.el.style.width === '') l.el.style.width = l.sizePx + 'px';

    // #2: đèn quá mờ -> ẩn hẳn để compositor bỏ qua lớp
    const hidden = alpha < 0.04;
    if (hidden){
      if (!l._hidden){ l.el.style.visibility = 'hidden'; l._hidden = true; }
      continue;
    }
    if (l._hidden){ l.el.style.visibility = ''; l._hidden = false; }

    l.el.style.transform =
      `translate3d(${(cx - l.sizePx/2).toFixed(1)}px, ${(cy - l.sizePx/2).toFixed(1)}px, 0) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(3)}rad)`;
    l.el.style.opacity = alpha.toFixed(3);
    l.el.style.zIndex = (1000 - Math.round(l.z*1000));

    if (l.cap == null && l.el.querySelector) l.cap = l.el.querySelector('.cap');
    if (l.cap) l.cap.style.display = (pp > 0.45 && l.spot < 0.5) ? '' : 'none';
  }
}

function fadeMul(l){
  if (l._fade == null) l._fade = 1;
  l._fade = Math.max(0, l._fade - 0.008);
  return l._fade;
}

// ── Nạp đèn có sẵn ──
fetch('/api/recent').then(r=>r.json()).then(list => {
  const n = list.length;
  list.forEach((rec, i) => {
    const isNear = i >= n - NEAR_MAX;
    const l = releaseToSky('/lanterns/' + rec.file, rec.name, rec.wish, isNear ? 1 : 2);
    l.z = isNear ? rand(0.08, Z_NEAR_HI) : (0.4 + Math.random()*0.55);
    l.phase = Math.random()*Math.PI*2;
    promoteNewest();
  });
}).catch(()=>{});

// ── Realtime: đèn mới -> GRAND ENTRANCE (CSS) rồi nhập bầu trời ──
const ENTRANCE_MS = 6500;
const entranceQ = [];
let entranceBusy = false;
const entEl   = document.getElementById('entrance');
const entImg  = document.getElementById('entImg');
const entName = document.getElementById('entName');
const entRays = document.getElementById('entRays');
const entGlow = document.getElementById('entGlow');
const entDim  = document.getElementById('entDim');

function restartAnim(el){ el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; }

function runEntrance(rec){
  entranceBusy = true;
  const src = '/lanterns/' + rec.file;
  entImg.src = src;
  entName.innerHTML =
    (rec.name ? `<div class="nm">🏮 ${escapeHtml(rec.name)}</div>` : '') +
    `<div class="sub">${rec.wish ? 'gửi một điều ước lên trời…' : 'vừa thả một chiếc lồng đèn!'}</div>` +
    (rec.wish ? `<div class="ws">“${escapeHtml(rec.wish)}”</div>` : '');
  entEl.classList.add('show');
  [entDim, entRays, entGlow, entImg, entName].forEach(restartAnim);
  setTimeout(() => {
    entEl.classList.remove('show');
    // giao cho bầu trời
    const l = releaseToSky(src, rec.name || '', rec.wish || '', 1);
    l.z = 0.06; l.phase = Math.random()*Math.PI*2;
    entranceBusy = false;
    pumpEntrance();
  }, ENTRANCE_MS);
}
function pumpEntrance(){
  if (entranceBusy || !entranceQ.length) return;
  runEntrance(entranceQ.shift());
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const socket = io();
socket.on('new-lantern', rec => {
  if (!rec || !rec.file) return;
  if (rec.id != null) socket.emit('lantern-shown', { id: rec.id });  // báo server: đèn đã nhận -> mở nút quạt
  entranceQ.push(rec);
  pumpEntrance();
});

// ── Bộ đếm ──
let lanternCount = 0;
function renderCount(){ document.getElementById('countN').textContent = lanternCount.toLocaleString('vi-VN'); }
fetch('/api/count').then(r=>r.json()).then(d=>{ lanternCount = d.count||0; renderCount(); }).catch(()=>{});
socket.on('new-lantern', () => { lanternCount++; renderCount(); });

// ── Toàn màn hình cho TV ──
function toggleFullscreen(){
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
function syncFsLabel(){
  const on = document.fullscreenElement || document.webkitFullscreenElement;
  const btn = document.getElementById('fsBtn');
  btn.style.display = on ? 'none' : '';
}
document.addEventListener('fullscreenchange', syncFsLabel);
document.addEventListener('webkitfullscreenchange', syncFsLabel);
// tự mờ nút sau 4s không tương tác
const fsBtn = document.getElementById('fsBtn');
let fsTimer;
function pokeFsBtn(){
  fsBtn.style.opacity = '1';
  clearTimeout(fsTimer);
  fsTimer = setTimeout(() => { fsBtn.style.opacity = '.15'; }, 4000);
}
window.addEventListener('mousemove', pokeFsBtn);
pokeFsBtn();

// ── Ẩn audio tip sau tương tác đầu (bản DOM không phát tiếng, chỉ dọn gợi ý) ──
function dismissTip(){
  const tip = document.getElementById('audioTip');
  if (tip) tip.style.display = 'none';
  window.removeEventListener('click', dismissTip);
  window.removeEventListener('keydown', dismissTip);
}
window.addEventListener('click', dismissTip);
window.addEventListener('keydown', dismissTip);

// ── FPS + bảng đổi trần (chỉ /screen?fps=1) ──
let _fpsFrames = 0, _fpsLast = 0, _fpsReadout = null;
const _perfOn = new URLSearchParams(location.search).has('fps');
function fpsTick(t){
  if (!_perfOn) return;
  _fpsFrames++;
  if (!_fpsLast) _fpsLast = t;
  if (t - _fpsLast >= 500){
    const fps = Math.round(_fpsFrames*1000/(t-_fpsLast));
    const alive = lanterns.filter(x=>!x.leaving).length;
    _fpsReadout.textContent = fps + ' fps · ' + alive + '/' + MAX + ' đèn';
    _fpsFrames = 0; _fpsLast = t;
  }
}
if (_perfOn){
  const panel = document.getElementById('perfPanel'); panel.style.display = 'block';
  _fpsReadout = document.getElementById('fpsReadout');
  const box = document.getElementById('maxButtons');
  [40,80,120,160,200].forEach(nn => {
    const b = document.createElement('button'); b.textContent = nn;
    b.onclick = () => { setMaxLanterns(nn);
      [...box.children].forEach(c=>c.style.background='#1a0f3c'); b.style.background='#8a1a12'; };
    if (nn === MAX) b.style.background = '#8a1a12';
    box.appendChild(b);
  });
}

requestAnimationFrame(frame);
</script>
