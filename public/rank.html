<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Đèn Sáng Nhất</title>
<style>
  :root{ --gold:#ffd77a; --gold2:#ffe9b0; --deep:#0a0620; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff; background:radial-gradient(120% 90% at 50% -10%, #241653 0%, var(--deep) 60%, #05030f 100%);
    min-height:100vh; overflow-x:hidden; }
  header{ text-align:center; padding:20px 16px 6px; }
  h1{ margin:0; font-size:clamp(26px,6vw,44px); font-weight:800;
    background:linear-gradient(180deg,#fff6e2,var(--gold) 55%,#ff8c1a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(255,180,80,.25); }
  .sub{ color:#c9bfff; font-size:14px; margin-top:6px; opacity:.9; }

  /* wallet bar */
  .wallet{ max-width:640px; margin:12px auto 0; padding:0 12px; display:flex; gap:10px; align-items:center; justify-content:center; }
  .bal{ background:linear-gradient(180deg, rgba(255,140,26,.22), rgba(181,52,12,.22));
    border:1px solid rgba(255,180,80,.35); border-radius:999px; padding:8px 16px; font-weight:800; color:var(--gold2); }
  .spinlink{ text-decoration:none; background:radial-gradient(circle at 50% 30%, #ff8c1a, #b5340c);
    color:#fff; font-weight:800; padding:9px 18px; border-radius:999px; box-shadow:0 4px 14px rgba(255,120,20,.5); }
  .hint{ text-align:center; color:#ffbe6b; font-size:13px; margin:10px 12px 0; }

  .podium{ display:flex; justify-content:center; align-items:flex-end; gap:14px; padding:14px 12px 6px; max-width:640px; margin:0 auto; }
  .pod{ flex:1; text-align:center; }
  .pod .halo{ position:relative; margin:0 auto; }
  .pod img{ width:100%; aspect-ratio:1; object-fit:contain; filter:drop-shadow(0 6px 22px rgba(255,190,90,.35)); animation:bob 3s ease-in-out infinite; }
  .pod.p1 img{ filter:drop-shadow(0 0 34px rgba(255,215,120,.9)); }
  .pod .rankNum{ font-size:26px; font-weight:800; }
  .pod.p1 .rankNum{ color:#ffd700; } .pod.p2 .rankNum{ color:#d8d8ff; } .pod.p3 .rankNum{ color:#ffab6b; }
  .pod .nm{ font-weight:700; font-size:15px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pod .fr{ color:var(--gold2); font-size:14px; }
  .pod.p1{ transform:translateY(-10px); } .pod.p1 .halo{ width:120px; } .pod.p2 .halo,.pod.p3 .halo{ width:92px; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }

  .list{ max-width:640px; margin:10px auto 40px; padding:10px 12px 0; }
  .row{ display:flex; align-items:center; gap:12px; padding:10px 12px; margin:8px 0;
    background:linear-gradient(180deg, rgba(60,40,120,.45), rgba(30,20,70,.4));
    border:1px solid rgba(255,215,120,.18); border-radius:16px;
    transition:transform .35s cubic-bezier(.2,.9,.3,1.2), box-shadow .3s; }
  .row.flash{ box-shadow:0 0 0 2px var(--gold), 0 0 26px rgba(255,200,90,.6); }
  /* the signed-in user's own lantern, pinned on top */
  .row.mine{ position:sticky; top:6px; z-index:5;
    background:linear-gradient(180deg, rgba(255,140,26,.32), rgba(181,52,12,.28));
    border:1.5px solid var(--gold); box-shadow:0 0 22px rgba(255,200,90,.45); }
  .row.mine .name{ color:var(--gold2); }
  .row.mine::before{ content:'Lồng đèn của bạn'; position:absolute; top:-9px; left:12px;
    font-size:10px; font-weight:800; color:#3a1500; background:var(--gold);
    padding:2px 8px; border-radius:999px; letter-spacing:.3px; }
  .pos{ width:26px; text-align:center; font-weight:800; color:var(--gold); font-size:17px; flex:none; }
  .thumb{ width:54px; height:54px; flex:none; object-fit:contain; filter:drop-shadow(0 3px 8px rgba(255,180,80,.35)); }
  .meta{ flex:1; min-width:0; }
  .name{ font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wish{ color:#c9bfff; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85; }
  .fire{ display:flex; align-items:center; gap:8px; flex:none; }
  .count{ font-weight:800; color:var(--gold2); font-size:17px; min-width:26px; text-align:right; }
  .btn{ border:none; cursor:pointer; font-size:22px; line-height:1; width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 50% 35%, #ff8c1a, #b5340c); box-shadow:0 4px 14px rgba(255,120,20,.5); transition:transform .12s; }
  .btn:active{ transform:scale(.86); }
  .btn.done{ background:radial-gradient(circle at 50% 35%,#6b5a2a,#3a2f12); box-shadow:none; opacity:.65; cursor:default; }
  .btn.disabled{ filter:grayscale(.7); opacity:.45; cursor:not-allowed; }
  .empty{ text-align:center; color:#c9bfff; margin-top:40px; }
  .float{ position:fixed; pointer-events:none; font-size:26px; z-index:50; animation:rise 1s ease-out forwards; }
  @keyframes rise{ from{ transform:translateY(0); opacity:1 } to{ transform:translateY(-70px); opacity:0 } }
</style>
</head>
<body>
  <header>
    <h1>🏮 Đèn Sáng Nhất</h1>
    <div class="sub">Đèn được yêu thích nhất <b>cả mùa Trung Thu</b> — lửa tích luỹ suốt 5 ngày!</div>
  </header>
  <div class="wallet">
    <a class="spinlink" href="/hub" style="background:#3a2168;">← Trang chính</a>
    <span class="bal" id="bal">🔥 …</span>
    <a class="spinlink" href="/spin">🎡 Quay thêm lửa</a>
  </div>
  <div class="hint" id="hint"></div>
  <div class="podium" id="podium"></div>
  <div class="list" id="list"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // identity comes from the Google session cookie now; no localStorage id.

    let board = [], wallet = { balance:0, canSpin:true, firedToday:[] };
    let myId = null;   // id of the signed-in user's own lantern (if any)
    const podium = document.getElementById('podium');
    const list = document.getElementById('list');
    const balEl = document.getElementById('bal');
    const hintEl = document.getElementById('hint');

    async function load(){
      const [lb, mine] = await Promise.all([
        fetch('/api/leaderboard').then(r=>r.json()),
        fetch('/api/my-lantern').then(r=>r.json()).catch(()=>({lantern:null})),
      ]);
      board = lb.board; if (lb.wallet) wallet = lb.wallet;
      myId = mine.lantern ? mine.lantern.id : null;
      render();
    }

    function renderWallet(){
      balEl.textContent = '🔥 ' + wallet.balance + ' lửa';
      if (wallet.balance > 0) hintEl.innerHTML = 'Bấm 🔥 để tặng lửa cho lồng đèn bạn thích (mỗi đèn 1 lửa/ngày, lửa tích luỹ cả mùa).';
      else if (wallet.canSpin) hintEl.innerHTML = 'Hết lửa rồi! <b>Quay vòng quay</b> để nhận thêm lửa 🎡';
      else hintEl.innerHTML = 'Bạn đã dùng hết lửa. Mai quay lại để nhận thêm nhé! 🌙';
    }

    function render(){
      renderWallet();
      const firedSet = new Set(wallet.firedToday || []);
      const canFire = wallet.balance > 0;

      const top = board.slice(0,3);
      const order = [top[1], top[0], top[2]].filter(Boolean);
      const cls = {}; if(top[0])cls[top[0].id]='p1'; if(top[1])cls[top[1].id]='p2'; if(top[2])cls[top[2].id]='p3';
      const rankOf = id => board.findIndex(b=>b.id===id)+1;
      podium.innerHTML = order.map(b=>`
        <div class="pod ${cls[b.id]}">
          <div class="halo"><img src="/lanterns/${b.file}" alt=""></div>
          <div class="rankNum">${rankOf(b.id)===1?'👑':'#'+rankOf(b.id)}</div>
          <div class="nm">${esc(b.name)||'Bé giấu tên'}</div>
          <div class="fr">🔥 ${b.fires}</div>
        </div>`).join('');

      list.innerHTML = board.length ? '' : '<div class="empty">Chưa có đèn nào được thả. Vào /screen thả đèn trước nhé!</div>';
      // pin the user's own lantern to the top of the list (but keep its REAL rank
      // number), so they immediately see where they stand.
      let rows = board.map((b,i)=>({ b, rank:i+1 }));
      if (myId != null){
        const mineIdx = rows.findIndex(x=>x.b.id===myId);
        if (mineIdx > -1){ const [mine] = rows.splice(mineIdx,1); rows.unshift(mine); }
      }
      rows.forEach(({b, rank})=>{
        const done = firedSet.has(b.id);
        const isMine = b.id === myId;
        const row = document.createElement('div');
        row.className = 'row' + (isMine ? ' mine' : ''); row.dataset.id = b.id;
        const btnCls = done ? 'done' : (canFire ? '' : 'disabled');
        row.innerHTML = `
          <div class="pos">${rank===1?'👑':'#'+rank}</div>
          <img class="thumb" src="/lanterns/${b.file}" alt="">
          <div class="meta">
            <div class="name">${isMine?'⭐ ':''}${esc(b.name)||'Bé giấu tên'}${isMine?' (bạn)':''}</div>
            <div class="wish">${esc(b.wish)||''}</div>
          </div>
          <div class="fire">
            <span class="count">${b.fires}</span>
            <button class="btn ${btnCls}" ${done?'disabled':''}>${done?'✓':'🔥'}</button>
          </div>`;
        const btn = row.querySelector('.btn');
        if(!done) btn.addEventListener('click', e => fire(b.id, e.currentTarget));
        list.appendChild(row);
      });
    }

    async function fire(id, btn){
      if (wallet.balance <= 0) { location.href = '/spin'; return; }
      const resp = await fetch('/api/fire', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id })
      });
      if (resp.status === 401){ location.href = '/'; return; }
      const r = await resp.json();
      if (r.wallet) wallet = r.wallet;
      if (!resp.ok) { render(); return; }
      floatEmoji(btn);
      const b = board.find(x=>x.id===id); if(b) b.fires = r.fires;
      resort(id);
    }

    function resort(changedId){
      board.sort((a,b)=> b.fires - a.fires || b.id - a.id);
      render();
      const row = list.querySelector(`.row[data-id="${changedId}"]`);
      if(row){ row.classList.add('flash'); setTimeout(()=>row.classList.remove('flash'), 700); }
    }

    function floatEmoji(btn){
      const r = btn.getBoundingClientRect();
      const f = document.createElement('div');
      f.className='float'; f.textContent='🔥';
      f.style.left = r.left + r.width/2 - 13 + 'px'; f.style.top = r.top - 6 + 'px';
      document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
    }

    const esc = s => (s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

    const socket = io();
    socket.on('fire-changed', ({id, fires}) => {
      const b = board.find(x=>x.id===id);
      if(b){ b.fires = fires; resort(id); } else load();
    });
    socket.on('new-lantern', load);

    load();
    window.addEventListener('pageshow', load);   // refresh wallet when coming back from /spin
  </script>
</body>
</html>
