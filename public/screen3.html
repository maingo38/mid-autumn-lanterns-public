<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bầu trời lồng đèn (DOM)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0620;font-family:system-ui,sans-serif;}
  /* Nền + vignette = lớp DOM (compositor GPU). Parallax bằng transform. */
  #bgLayer{ position:fixed; inset:0; z-index:0;
    background:url('/decor/Background.jpeg') center/cover no-repeat #0a0620; }
  #bgVig{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 70% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(4,2,16,0.55) 100%); }
  #frameVig{ position:fixed; inset:0; z-index:50; pointer-events:none;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }

  /* Sân khấu chứa đèn. Mỗi đèn di chuyển CHỈ bằng transform (không layout, không repaint). */
  #stage{ position:fixed; inset:0; z-index:2; }
  .lantern{ position:absolute; left:0; top:0; will-change:transform,opacity;
            transform-origin:50% 50%; pointer-events:auto; }
  /* Quầng sáng: radial-gradient MỀM sẵn (không dùng filter:blur -> tránh CPU).
     Nhấp nháy nến = animate opacity (compositor). */
  .lantern .glow{ position:absolute; left:50%; top:50%; width:200%; height:200%;
     transform:translate(-50%,-50%); pointer-events:none; z-index:-1;
     background:radial-gradient(circle, rgba(255,190,90,0.9) 0%, rgba(255,175,80,0.45) 38%, rgba(255,140,30,0) 70%);
     animation:flick 2.4s ease-in-out infinite; }
  .lantern img{ display:block; width:100%; height:auto; }
  .lantern .cap{ position:absolute; left:50%; top:100%; transform:translateX(-50%);
     text-align:center; line-height:1.25; text-shadow:0 2px 8px #000c; white-space:nowrap; margin-top:4px; }
  .lantern .nm{ font:700 15px system-ui,sans-serif; color:#ffe9b0; }
  .lantern .ws{ font:italic 500 13px Georgia,serif; color:#e9e0ff; }
  @keyframes flick{ 0%,100%{opacity:.55} 45%{opacity:1} 70%{opacity:.72} }

  #fsBtn{ position:fixed; right:18px; top:18px; z-index:60;
          background:#1a0f3ccc; color:#ffe9b0; border:1px solid #ffd77a; border-radius:20px;
          padding:8px 14px; font:600 14px system-ui,sans-serif; cursor:pointer; box-shadow:0 4px 16px #0007; }

  #countBar{ position:fixed; left:26px; bottom:26px; z-index:8;
     font-weight:800; font-size:22px; color:#ffe9b0; text-shadow:0 2px 10px #000a; pointer-events:none; }
  #countBar b{ font-size:30px; color:#ffcf6a; }

  /* Bảng đo hiệu năng — chỉ hiện khi /screen3?fps=1 */
  #perfPanel{ display:none; position:fixed; left:50%; top:60px; transform:translateX(-50%); z-index:70;
     background:#0a0620dd; color:#ffe9b0; border:1px solid #ffd77a; border-radius:14px; padding:10px 14px;
     font:600 14px system-ui,sans-serif; box-shadow:0 4px 16px #0009; text-align:center; }
  #fpsReadout{ font-size:22px; font-weight:800; margin-bottom:6px; }
  #maxButtons{ display:flex; gap:6px; justify-content:center; }
  #maxButtons button{ background:#1a0f3c; color:#ffe9b0; border:1px solid #ffd77a; border-radius:10px;
     padding:6px 12px; font:700 14px system-ui,sans-serif; cursor:pointer; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgVig"></div>
<div id="stage"></div>
<div id="frameVig"></div>

<button id="fsBtn" onclick="toggleFullscreen()">⛶ Toàn màn hình</button>
<div id="countBar">Đã có hơn <b id="countN">…</b> lồng đèn<br>được thả tại VML Việt Nam</div>

<div id="perfPanel">
  <div id="fpsReadout">-- fps</div>
  <div id="maxButtons"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
//  /screen3 — BẢN DOM: bỏ canvas hoàn toàn. Mỗi lồng đèn là 1 phần tử
//  DOM, di chuyển CHỈ bằng transform + opacity -> chạy trên compositor
//  GPU của TV (giống logo lồng đèn vốn đã mượt). KHÔNG dùng filter/blur.
// ══════════════════════════════════════════════════════════════════
const CONFIG = {
  maxLanterns: 40,
  lanternVh:   0.20,   // đường kính đèn lớp gần ~ 20% chiều nhỏ màn
  showNames:   true,
  spotZoom:    1.9,
  spotEase:    0.10,
  wobbleMin:   6, wobbleMax: 16,
  sizeMin:     0.85, sizeMax: 1.15,
};

let W = innerWidth, H = innerHeight;
addEventListener('resize', () => { W = innerWidth; H = innerHeight; });

const stage = document.getElementById('stage');
const rand = (a,b) => a + Math.random()*(b-a);

// ── #3 Throttle ~30fps: cảnh trôi chậm, 30 vs 60 mắt không phân biệt, nhẹ 1/2 việc
const STEP_MS = 1000/30;
let _lastStep = 0;

// ── #1 Thu nhỏ ảnh khi ĐÔNG: giảm bộ nhớ/băng thông texture của TV yếu.
// Thang bậc theo số đèn — càng đông càng nhỏ (đèn đông phần lớn ở xa, hiện
// rất nhỏ nên hạ texture không ảnh hưởng mắt nhìn):
//   <40  -> ảnh gốc (nét)
//   >=40 -> tối đa 160px
//   >=80 -> tối đa 100px
//   >=120 -> tối đa 80px
//   >=160 -> tối đa 64px
//   >=200 -> tối đa 52px
// Trả 0 = giữ ảnh gốc. Downscale 1 lần/(src+size), cache theo cả kích thước.
function targetMax(){
  const n = lanterns.filter(x=>!x.leaving).length;
  if (n >= 200) return 52;
  if (n >= 160) return 64;
  if (n >= 120) return 80;
  if (n >= 80)  return 100;
  if (n >= 40)  return 160;
  return 0;
}

// ── Zoom-out theo mật độ: càng đông -> mỗi đèn hiển thị nhỏ lại để có chỗ cho
// nhiều đèn hơn. Hệ số toàn cục, nội suy theo số đèn từ 1.0 (ít) -> CROWD_MIN
// (đông), rồi làm mượt dần mỗi frame để co/giãn êm khi số đèn đổi.
const CROWD_LO = 40, CROWD_HI = 200;   // dải số đèn để nội suy
const CROWD_MIN = 0.5;                  // ở >=200 đèn, mỗi đèn còn 50% cỡ
let crowdScale = 1;
function targetCrowdScale(){
  const n = lanterns.filter(x=>!x.leaving).length;
  const f = Math.max(0, Math.min(1, (n - CROWD_LO)/(CROWD_HI - CROWD_LO)));
  return 1 - (1 - CROWD_MIN)*f;
}
const _smallCache = new Map();  // 'src@max' -> dataURL nhỏ
function makeSmall(fullSrc, max, cb){
  const key = fullSrc + '@' + max;
  const cached = _smallCache.get(key);
  if (cached){ cb(cached); return; }
  const im = new Image();
  im.onload = () => {
    const s = Math.min(1, max/Math.max(im.width, im.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width*s));
    c.height = Math.max(1, Math.round(im.height*s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    let url; try { url = c.toDataURL('image/png'); } catch(e){ url = fullSrc; }
    _smallCache.set(key, url); cb(url);
  };
  im.onerror = () => cb(fullSrc);
  im.src = fullSrc;
}
// gán src cho 1 đèn: đông -> ảnh nhỏ theo bậc, thưa -> ảnh gốc
function setLanternSrc(dom, fullSrc){
  const max = targetMax();
  if (max) makeSmall(fullSrc, max, u => { dom.img.src = u; });
  else dom.img.src = fullSrc;
}

// ── #2 Rải tránh chụm: chọn điểm bay theo 'best-candidate' — thử vài điểm ngẫu
// nhiên, giữ điểm CÁCH XA các đèn hiện có nhất -> tản đều, ít đè lên nhau.
function bestFar(xMin, xMax, yMin, yMax){
  let best = null, bestD = -1;
  for (let k=0; k<6; k++){
    const x = rand(xMin, xMax), y = rand(yMin, yMax);
    let d = Infinity;
    for (const o of lanterns){
      if (o.leaving || o.farX == null) continue;
      const dx = x-o.farX, dy = y-o.farY, dd = dx*dx + dy*dy;
      if (dd < d) d = dd;
    }
    if (d > bestD){ bestD = d; best = {x, y}; }
  }
  return best;
}

// Nền là ảnh tĩnh (CSS #bgLayer) — không parallax, không cập nhật mỗi frame.

// ── Mô hình bay (giữ nguyên tinh thần /screen) ──
let MAX = CONFIG.maxLanterns;
const lanterns = [];
let spotlight = null;

function newTrack(){
  const p = bestFar(W*0.06, W*0.94, H*0.08, H*0.92);
  const fx = p.x, fy = p.y;
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.06, Math.min(W,H)*0.22);
  return { farX:fx, farY:fy, startX:fx+Math.cos(ang)*dist, startY:fy+Math.sin(ang)*dist };
}
function newTrackNear(){
  const p = bestFar(W*0.22, W*0.78, H*0.22, H*0.72);
  const fx = p.x, fy = p.y;
  const ang = Math.random()*Math.PI*2;
  const dist = rand(Math.min(W,H)*0.03, Math.min(W,H)*0.10);
  return { farX:fx, farY:fy, startX:fx+Math.cos(ang)*dist, startY:fy+Math.sin(ang)*dist };
}
const NEAR_MAX = 5, Z_NEAR_HI = 0.32, Z_NEAR_LO = -0.05;
function assignLayer(l, layer){
  l.layer = layer;
  if (layer === 1){
    Object.assign(l, newTrackNear());
    l.zSpeed = rand(0.00035, 0.00060);
    if (l.z == null || l.z > Z_NEAR_HI) l.z = rand(0.06, Z_NEAR_HI);
  } else {
    Object.assign(l, newTrack());
    l.zSpeed = rand(0.00055, 0.00090);
  }
}
function promoteNewest(){
  const near = lanterns.filter(x=>!x.leaving && x.layer===1).sort((a,b)=>a.born-b.born);
  while (near.length > NEAR_MAX){ const old = near.shift(); assignLayer(old,2); old.z = rand(0.4,0.8); }
}

// tạo phần tử DOM cho 1 đèn
function makeEl(name, wish){
  const el = document.createElement('div'); el.className = 'lantern';
  const glow = document.createElement('div'); glow.className = 'glow';
  glow.style.animationDelay = (-Math.random()*2.4).toFixed(2)+'s';
  const img = document.createElement('img');
  const el_ = el;
  el.appendChild(glow); el.appendChild(img);
  let capNm=null, capWs=null;
  if (CONFIG.showNames && (name||wish)){
    const cap = document.createElement('div'); cap.className='cap';
    capNm = document.createElement('div'); capNm.className='nm'; capNm.textContent = name||'';
    capWs = document.createElement('div'); capWs.className='ws'; capWs.textContent = wish?('“'+wish+'”'):'';
    if (name) cap.appendChild(capNm);
    if (wish) cap.appendChild(capWs);
    el.appendChild(cap);
  }
  stage.appendChild(el);
  return { el, img, glow };
}

function releaseToSky(src, name, wish, layer){
  const dom = makeEl(name, wish);
  dom.fullSrc = src;                  // giữ src gốc để clone/thay đổi độ nét sau
  setLanternSrc(dom, src);            // #1: đông -> ảnh nhỏ, thưa -> gốc
  const l = {
    ...dom, name:name||'', wish:wish||'',
    ...newTrack(), z:0.08, zSpeed:rand(0.00055,0.00090),
    phase:Math.random()*Math.PI*2, drift:0.4+Math.random()*0.5,
    amp:rand(CONFIG.wobbleMin,CONFIG.wobbleMax),
    sizePx: (Math.min(W,H)*CONFIG.lanternVh)*rand(CONFIG.sizeMin,CONFIG.sizeMax),
    spot:0, born:performance.now(), layer:1,
  };
  lanterns.push(l);
  assignLayer(l, layer||1);
  promoteNewest();
  const alive = lanterns.filter(x=>!x.leaving);
  if (alive.length > MAX){ alive.sort((a,b)=>a.born-b.born); alive[0].leaving = true; }
  return l;
}

function removeLantern(l){ if (l.el && l.el.parentNode) l.el.remove(); }

// đổi trần số đèn tại chỗ (test)
function setMaxLanterns(n){
  MAX = n;
  const alive = lanterns.filter(x=>!x.leaving);
  if (alive.length > MAX){
    alive.sort((a,b)=>a.born-b.born);
    for (let i=0;i<alive.length-MAX;i++) alive[i].leaving = true;
  } else {
    const pool = alive.filter(l=>l.fullSrc);
    if (!pool.length) return;
    for (let i=alive.length;i<MAX;i++){
      const s = pool[(Math.random()*pool.length)|0];
      const l = releaseToSky(s.fullSrc, s.name, s.wish, 2);
      l.z = Math.random(); l.phase = Math.random()*Math.PI*2;
    }
  }
}

// ── Spotlight: chạm/giữ để phóng to đèn gần con trỏ ──
function lanternAtPoint(px, py){
  const elem = document.elementFromPoint(px, py);
  if (!elem) return null;
  const wrap = elem.closest('.lantern');
  if (!wrap) return null;
  return lanterns.find(l => l.el === wrap && !l.leaving) || null;
}
addEventListener('pointerdown', e => { spotlight = lanternAtPoint(e.clientX, e.clientY); }, {passive:true});
addEventListener('pointerup', () => spotlight = null);
addEventListener('pointercancel', () => spotlight = null);

// ── Vòng lặp: CHỈ ghi transform + opacity ──
function frame(t){
  requestAnimationFrame(frame);
  if (t - _lastStep < STEP_MS) return;   // #3: giới hạn ~30fps
  _lastStep = t;
  fpsTick(t);
  crowdScale += (targetCrowdScale() - crowdScale) * 0.05;   // zoom-out theo mật độ, làm mượt

  for (let i=lanterns.length-1; i>=0; i--){
    const l = lanterns[i];
    const isSpot = (l === spotlight);
    l.spot += ((isSpot?1:0) - l.spot) * CONFIG.spotEase;

    if (!isSpot) l.z -= l.zSpeed * (1 - l.spot*0.96);

    if (l.layer === 1){
      if (l.z <= Z_NEAR_LO){
        if (l.leaving){ removeLantern(l); lanterns.splice(i,1); continue; }
        l.z = Z_NEAR_HI; Object.assign(l, newTrackNear()); l.phase = Math.random()*Math.PI*2;
      }
    } else {
      if (l.z <= -0.28){
        if (l.leaving){ removeLantern(l); lanterns.splice(i,1); continue; }
        l.z = 1; Object.assign(l, newTrack()); l.phase = Math.random()*Math.PI*2;
      }
    }
    l.phase += 0.02*l.drift;

    const pp = Math.max(0, 1 - l.z);
    const t01 = 1 - l.z;
    const cx = l.farX + (l.startX-l.farX)*t01 + Math.sin(l.phase)*l.amp*pp*(1-l.spot);
    const cy = l.farY + (l.startY-l.farY)*t01 + Math.cos(l.phase*0.8)*l.amp*0.5*pp*(1-l.spot);

    let alpha;
    if (l.layer === 1){
      const vanishN = Math.min(1, Math.max(0, (l.z - Z_NEAR_LO)/0.10));
      alpha = Math.max(0, Math.min(1, vanishN * (l.leaving?fadeMul(l):1)));
    } else {
      const appear = Math.min(1, (1 - l.z)/0.12);
      const vanish = Math.min(1, Math.max(0, (l.z + 0.28)/0.30));
      const depthDim = 0.5 + 0.5*pp;
      alpha = Math.max(0, Math.min(1, appear * vanish * depthDim * (l.leaving?fadeMul(l):1)));
    }

    const zoom = 1 + l.spot*(CONFIG.spotZoom-1);
    // spotlight (đang soi) miễn zoom-out để đèn được soi vẫn to rõ
    const crowd = crowdScale + (1 - crowdScale)*l.spot;
    const px = l.sizePx * pp * zoom * crowd;         // bề rộng hiển thị thực
    const scale = px / l.sizePx;                     // img gốc đặt width=sizePx, scale để mượt
    const rot = Math.sin(l.phase)*0.05*(1-l.spot);

    // đặt width 1 lần (khi biết ảnh) — sau đó chỉ transform
    if (l.el.style.width === '') l.el.style.width = l.sizePx + 'px';

    // #2: đèn quá mờ -> ẩn hẳn (visibility:hidden) để compositor bỏ qua lớp này
    const hidden = alpha < 0.04;
    if (hidden){
      if (!l._hidden){ l.el.style.visibility = 'hidden'; l._hidden = true; }
      continue;   // khỏi ghi transform/opacity cho lớp ẩn
    }
    if (l._hidden){ l.el.style.visibility = ''; l._hidden = false; }

    l.el.style.transform =
      `translate3d(${(cx - l.sizePx/2).toFixed(1)}px, ${(cy - l.sizePx/2).toFixed(1)}px, 0) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(3)}rad)`;
    l.el.style.opacity = alpha.toFixed(3);
    l.el.style.zIndex = (1000 - Math.round(l.z*1000));   // gần (z nhỏ) vẽ trên

    // tên chỉ hiện khi đủ gần & không quá mờ
    if (l.cap == null && l.el.querySelector) l.cap = l.el.querySelector('.cap');
    if (l.cap) l.cap.style.display = (pp > 0.45 && l.spot < 0.5) ? '' : 'none';
  }
}

// đèn 'leaving' mờ dần rồi bị dọn khi chạm mép dải
function fadeMul(l){
  if (l._fade == null) l._fade = 1;
  l._fade = Math.max(0, l._fade - 0.02);
  return l._fade;
}

// ── Nạp đèn có sẵn ──
fetch('/api/recent').then(r=>r.json()).then(list => {
  const n = list.length;
  list.forEach((rec, i) => {
    const isNear = i >= n - NEAR_MAX;
    const l = releaseToSky('/lanterns/' + rec.file, rec.name, rec.wish, isNear ? 1 : 2);
    l.z = isNear ? rand(0.08, Z_NEAR_HI) : (0.4 + Math.random()*0.55);
    l.phase = Math.random()*Math.PI*2;
    promoteNewest();
  });
}).catch(()=>{});

// ── Realtime: đèn mới -> vào thẳng bầu trời (bản DOM bỏ nghi lễ entrance nặng) ──
const socket = io();
socket.on('new-lantern', rec => {
  if (!rec || !rec.file) return;
  const l = releaseToSky('/lanterns/' + rec.file, rec.name || '', rec.wish || '', 1);
  l.z = 0.06; l.phase = Math.random()*Math.PI*2;
});

// ── Bộ đếm ──
let lanternCount = 0;
function renderCount(){ document.getElementById('countN').textContent = lanternCount.toLocaleString('vi-VN'); }
fetch('/api/count').then(r=>r.json()).then(d=>{ lanternCount = d.count||0; renderCount(); }).catch(()=>{});
socket.on('new-lantern', () => { lanternCount++; renderCount(); });

// ── Toàn màn hình ──
function toggleFullscreen(){
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEl) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}

// ── FPS + bảng đổi trần (chỉ /screen3?fps=1) ──
let _fpsFrames = 0, _fpsLast = 0, _fpsReadout = null;
const _perfOn = new URLSearchParams(location.search).has('fps');
function fpsTick(t){
  if (!_perfOn) return;
  _fpsFrames++;
  if (!_fpsLast) _fpsLast = t;
  if (t - _fpsLast >= 500){
    const fps = Math.round(_fpsFrames*1000/(t-_fpsLast));
    const alive = lanterns.filter(x=>!x.leaving).length;
    _fpsReadout.textContent = fps + ' fps · ' + alive + '/' + MAX + ' đèn';
    _fpsFrames = 0; _fpsLast = t;
  }
}
if (_perfOn){
  const panel = document.getElementById('perfPanel'); panel.style.display = 'block';
  _fpsReadout = document.getElementById('fpsReadout');
  const box = document.getElementById('maxButtons');
  [40,80,120,160,200].forEach(nn => {
    const b = document.createElement('button'); b.textContent = nn;
    b.onclick = () => { setMaxLanterns(nn);
      [...box.children].forEach(c=>c.style.background='#1a0f3c'); b.style.background='#8a1a12'; };
    if (nn === MAX) b.style.background = '#8a1a12';
    box.appendChild(b);
  });
}

requestAnimationFrame(frame);
</script>
</body>
</html>
