<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lan Banh Ve Dich</title>
<style>
  :root{ --gold:#ffd77a; --gold2:#ffe9b0; --deep:#0a0620; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff; background:#0d0a26 url('/decor/Background.jpeg') center top / cover no-repeat fixed;
    min-height:100vh; overflow:hidden; text-align:center; display:flex; flex-direction:column; align-items:center; }
  h1{ margin:16px 16px 2px; font-size:clamp(21px,5.2vw,30px); font-weight:800; position:relative; z-index:3;
    background:linear-gradient(180deg,#fff6e2,var(--gold) 55%,#ff8c1a);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 30px rgba(255,180,80,.3); }
  .sub{ color:#cbb8ff; font-size:13px; margin:0 20px; position:relative; z-index:3; max-width:350px; line-height:1.4; }
  .hud{ position:relative; z-index:3; display:flex; gap:16px; margin-top:8px; font-weight:800; }
  .hud .box{ background:#241542; border:1.5px solid rgba(255,215,120,.3); border-radius:12px; padding:7px 15px; }
  .hud .box span{ color:var(--gold2); }

  #arena{ position:relative; z-index:2; margin:12px 0 6px; border-radius:22px;
    border:3px solid #ffcf6a; touch-action:none;
    box-shadow:0 0 0 4px #b5340c, 0 0 26px rgba(255,180,80,.35), 0 16px 40px rgba(0,0,0,.55); }

  .b{ position:relative; z-index:3; margin:10px 0 2px; border:none; cursor:pointer; font-size:19px; font-weight:800; color:#fff;
    padding:15px 40px; border-radius:999px; background:radial-gradient(circle at 50% 26%, #ffa63d, #ff8c1a 40%, #b5340c);
    box-shadow:0 8px 24px rgba(255,120,20,.6), inset 0 2px 0 rgba(255,255,255,.4); transition:transform .1s; }
  .b:active{ transform:scale(.95); }
  .b:disabled{ background:radial-gradient(circle at 50% 26%,#6b5a2a,#3a2f12); box-shadow:none; opacity:.7; }
  .result{ position:relative; z-index:3; margin:8px 16px; min-height:22px; font-size:17px; font-weight:800; color:var(--gold); }
  .backlink{ display:inline-block; margin:2px 0 14px; color:#cbb8ff; text-decoration:none; font-weight:700; position:relative; z-index:3;
    border:1px solid rgba(255,215,120,.3); border-radius:999px; padding:9px 20px; }
  .confetti{ position:fixed; top:-10px; font-size:22px; z-index:60; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(360deg); opacity:0; } }
  /* lu1edbp phu1ee7 tu1889 nhu1eb9 tru00ean nu1ec1n demo -> chu1eef du1ec5 u0111u1ecdc */
  body::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, #0a081e33 0%, #0a081e66 55%, #0a081eaa 100%); }
  /* rabbit nav dropdown (góc phải trên) */
  .rnav{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:9999; }
  .rnav-btn{ display:flex; align-items:center; gap:4px; cursor:pointer; font-size:20px; line-height:1;
    color:#ffe9b0; background:rgba(20,14,40,.7); border:1px solid rgba(255,215,120,.4); border-radius:999px;
    padding:8px 12px; box-shadow:0 4px 14px rgba(0,0,0,.4); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  .rnav-btn .caret{ font-size:12px; color:#ffd166; }
  .rnav-menu{ position:absolute; top:calc(100% + 8px); right:0; min-width:190px; display:none;
    background:rgba(20,14,40,.96); border:1px solid rgba(255,215,120,.35); border-radius:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.55); overflow:hidden; padding:6px; }
  .rnav.open .rnav-menu{ display:block; }
  .rnav-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    font-size:15px; font-weight:700; color:#ffe9b0; background:none; border:none; border-radius:10px; padding:11px 12px; }
  .rnav-item:hover{ background:rgba(255,209,102,.16); color:#fff; }
</style>
</head>
<body>
  <div class="rnav" id="rnav">
    <button class="rnav-btn" id="rnavBtn" aria-haspopup="true" aria-expanded="false">🐰<span class="caret">▾</span></button>
    <div class="rnav-menu" role="menu">
      <button class="rnav-item" onclick="location.href='/'">🏠 Trang chính</button>
      <button class="rnav-item" onclick="location.href='/hub'">🎮 Trò chơi</button>
      <button class="rnav-item" onclick="location.href='/rank'">📊 Bảng xếp hạng</button>
    </div>
  </div>
  <h1>🥮 Lăn Bánh Né Hố Như Né Họp</h1>
  <div class="sub">Nghiêng điện thoại để lăn bánh vào <b>lồng đèn</b> 🏮, tránh rơi xuống hố. Vào được càng nhiều, càng nhiều lửa! (20 giây)</div>
  <div class="hud">
    <div class="box">⏱️ <span id="time">20</span>s</div>
    <div class="box">🏮 <span id="goals">0</span></div>
    <div class="box">🔥 <span id="bal">…</span></div>
  </div>

  <canvas id="arena"></canvas>

  <button class="b" id="go">Bắt đầu!</button>
  <div class="result" id="result"></div>
  <a class="backlink" href="/hub">← Về trang chính</a>

  <script>
    const cv = document.getElementById('arena');
    const ctx = cv.getContext('2d');
    const timeEl = document.getElementById('time');
    const goalsEl = document.getElementById('goals');
    const balEl = document.getElementById('bal');
    const goBtn = document.getElementById('go');
    const resultEl = document.getElementById('result');

    const DURATION = 20;         // seconds
    const GOAL_TARGET = 8;       // goals for a perfect (100) score
    let W = 0, H = 0, R = 16;    // canvas size + ball radius
    let playedToday = false, running = false, started = false;
    let ball, vel, goal, holes = [], walls = [], goals = 0, rafId = 0, tickId = 0, left = DURATION;
    let tiltX = 0, tiltY = 0;    // control input (-1..1)
    let noSensor = false, dragging = false;
    let trail = [];              // recent ball positions for a motion trail
    let sparks = [];             // little burst when a goal is reached
    let tnow = 0;                // animation clock (for pulsing glow)

    function sizeCanvas(){
      const w = Math.min(window.innerWidth*0.94, 420);
      const h = Math.min(window.innerHeight*0.52, 460);
      cv.style.width = w+'px'; cv.style.height = h+'px';
      const dpr = Math.min(window.devicePixelRatio||1, 2);
      cv.width = w*dpr; cv.height = h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      W = w; H = h;
    }

    async function loadWallet(){
      const r = await (await fetch('/api/wallet')).json();
      if (!r.wallet){ location.href = '/'; return; }
      playedToday = !r.wallet.canPuzzle;
      balEl.textContent = r.wallet.balance;
      if (playedToday){ goBtn.disabled = true; goBtn.textContent = 'Đã chơi hôm nay 🌙';
        if(!resultEl.textContent) resultEl.textContent = 'Mai quay lại lăn tiếp nhé!'; }
    }

    function rand(min,max){ return min + Math.random()*(max-min); }
    function placeGoal(){
      // put the goal somewhere not overlapping the ball or holes
      for (let i=0;i<50;i++){
        const g = { x:rand(40,W-40), y:rand(40,H-40), r:22 };
        if (Math.hypot(g.x-ball.x,g.y-ball.y) < 90) continue;
        if (holes.some(h=>Math.hypot(h.x-g.x,h.y-g.y) < 60)) continue;
        goal = g; return;
      }
      goal = { x:W/2, y:40, r:22 };
    }
    function resetLevel(){
      ball = { x:W/2, y:H-40 }; vel = { x:0, y:0 };
      holes = [];
      const nHoles = 4 + Math.floor(goals/2);   // more holes as you score
      for (let i=0;i<Math.min(nHoles,9);i++){
        holes.push({ x:rand(50,W-50), y:rand(70,H-70), r:20 });
      }
      // drop any hole too close to the ball start
      holes = holes.filter(h=>Math.hypot(h.x-ball.x,h.y-ball.y) > 80);
      placeGoal();
    }

    function start(){
      if (running || playedToday) return;
      started = true; running = true; goals = 0; left = DURATION;
      goalsEl.textContent = '0'; timeEl.textContent = left; resultEl.textContent = '';
      goBtn.textContent = noSensor ? '🖱️ Kéo để lăn' : '📱 Nghiêng máy để lăn';
      resetLevel();
      rafId = requestAnimationFrame(loop);
      tickId = setInterval(()=>{ left--; timeEl.textContent = left; if(left<=0) finish(); }, 1000);
    }

    function loop(){
      tnow = performance.now();
      // accelerate by tilt; friction; bounce off walls
      vel.x += tiltX * 0.5; vel.y += tiltY * 0.5;
      vel.x *= 0.94; vel.y *= 0.94;
      ball.x += vel.x; ball.y += vel.y;
      if (ball.x < R){ ball.x = R; vel.x *= -0.5; }
      if (ball.x > W-R){ ball.x = W-R; vel.x *= -0.5; }
      if (ball.y < R){ ball.y = R; vel.y *= -0.5; }
      if (ball.y > H-R){ ball.y = H-R; vel.y *= -0.5; }
      // motion trail (keep a few recent points)
      trail.push({ x:ball.x, y:ball.y }); if (trail.length > 10) trail.shift();
      // fall in a hole -> reset ball to start
      for (const h of holes){
        if (Math.hypot(ball.x-h.x, ball.y-h.y) < h.r*0.7){
          ball.x = W/2; ball.y = H-40; vel.x = vel.y = 0; trail = []; flash('#ff6b6b'); break;
        }
      }
      // reached goal
      if (goal && Math.hypot(ball.x-goal.x, ball.y-goal.y) < goal.r + R*0.4){
        goals++; goalsEl.textContent = goals; flash('#66bb6a'); burstSparks(goal.x, goal.y);
        resetLevel();
      }
      draw();
      if (running) rafId = requestAnimationFrame(loop);
    }

    let flashColor = null, flashUntil = 0;
    function flash(c){ flashColor = c; flashUntil = performance.now()+160; }
    function burstSparks(x,y){
      for (let i=0;i<14;i++){ const a=Math.random()*7, sp=rand(1,4);
        sparks.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1 }); }
    }

    function draw(){
      // playfield background: soft moonlit felt + subtle grid dots
      const bg = ctx.createRadialGradient(W/2,H*0.35,10, W/2,H*0.5,Math.max(W,H)*0.75);
      bg.addColorStop(0,'#33206a'); bg.addColorStop(1,'#160c2e');
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(255,215,120,0.05)';
      for (let gx=18; gx<W; gx+=34) for (let gy=18; gy<H; gy+=34){ ctx.beginPath(); ctx.arc(gx,gy,1.3,0,7); ctx.fill(); }

      // holes — deep pit with a soft rim shadow
      for (const h of holes){
        ctx.save();
        // rim shadow around the mouth
        const rim = ctx.createRadialGradient(h.x,h.y,h.r*0.6, h.x,h.y,h.r*1.35);
        rim.addColorStop(0,'rgba(0,0,0,0)'); rim.addColorStop(1,'rgba(0,0,0,0.5)');
        ctx.fillStyle=rim; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*1.35,0,7); ctx.fill();
        // the pit
        const g = ctx.createRadialGradient(h.x,h.y-h.r*0.2,2, h.x,h.y,h.r);
        g.addColorStop(0,'#000'); g.addColorStop(0.7,'#0b0720'); g.addColorStop(1,'#241a40');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.fill();
        // thin glossy edge
        ctx.lineWidth=1.5; ctx.strokeStyle='rgba(120,90,180,0.5)'; ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,7); ctx.stroke();
        ctx.restore();
      }

      // goal = glowing lantern with pulsing halo + guide ring
      if (goal){
        const pulse = 0.5 + 0.5*Math.sin(tnow*0.006);
        ctx.save();
        const halo = ctx.createRadialGradient(goal.x,goal.y,4, goal.x,goal.y,goal.r*2.4);
        halo.addColorStop(0,`rgba(255,207,106,${0.5+0.3*pulse})`); halo.addColorStop(1,'rgba(255,207,106,0)');
        ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(goal.x,goal.y,goal.r*2.4,0,7); ctx.fill();
        // dashed guide ring that rotates
        ctx.strokeStyle=`rgba(255,233,176,${0.4+0.3*pulse})`; ctx.lineWidth=2; ctx.setLineDash([6,7]);
        ctx.lineDashOffset = -tnow*0.02;
        ctx.beginPath(); ctx.arc(goal.x,goal.y,goal.r*1.5,0,7); ctx.stroke(); ctx.setLineDash([]);
        // lantern emoji
        ctx.shadowColor='#ffcf6a'; ctx.shadowBlur=18;
        ctx.font=(goal.r*1.9)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🏮', goal.x, goal.y + Math.sin(tnow*0.004)*3);
        ctx.restore();
      }

      // motion trail behind the mooncake
      for (let i=0;i<trail.length;i++){
        const a = (i/trail.length)*0.35;
        ctx.fillStyle = `rgba(255,200,120,${a})`;
        ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, R*(0.4+0.5*i/trail.length), 0, 7); ctx.fill();
      }

      // ground shadow under the ball
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(ball.x, ball.y+R*0.8, R*0.9, R*0.4, 0, 0, 7); ctx.fill();

      drawMooncake(ball.x, ball.y, R);

      // sparks on scoring
      for (let i=sparks.length-1;i>=0;i--){ const s=sparks[i];
        s.x+=s.vx; s.y+=s.vy; s.vy+=0.08; s.life-=0.04;
        if (s.life<=0){ sparks.splice(i,1); continue; }
        ctx.fillStyle=`rgba(255,${180+Math.random()*60|0},100,${s.life})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,7); ctx.fill();
      }

      if (flashColor && performance.now() < flashUntil){
        ctx.fillStyle = hexA(flashColor, 0.12);
        ctx.fillRect(0,0,W,H);
      }
    }
    function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }

    // draw a realistic-ish mooncake: golden-brown puck with imprinted pattern
    function drawMooncake(x,y,r){
      ctx.save(); ctx.translate(x,y);
      // drop shadow
      ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
      // body
      const g = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r);
      g.addColorStop(0,'#e8a457'); g.addColorStop(0.6,'#c97e33'); g.addColorStop(1,'#9c5a1f');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
      ctx.shadowColor='transparent';
      // raised rim
      ctx.lineWidth=2.5; ctx.strokeStyle='#7c4415'; ctx.beginPath(); ctx.arc(0,0,r-1.5,0,7); ctx.stroke();
      // scalloped edge dots
      ctx.fillStyle='#b06e28';
      for(let i=0;i<12;i++){ const a=i/12*7; ctx.beginPath(); ctx.arc(Math.cos(a)*(r-3), Math.sin(a)*(r-3), 1.6, 0,7); ctx.fill(); }
      // centre imprint square + cross (the classic mooncake stamp)
      ctx.strokeStyle='#6b3a12'; ctx.lineWidth=1.6;
      const s=r*0.5; ctx.strokeRect(-s/2,-s/2,s,s);
      ctx.beginPath(); ctx.moveTo(0,-s/2); ctx.lineTo(0,s/2); ctx.moveTo(-s/2,0); ctx.lineTo(s/2,0); ctx.stroke();
      // highlight
      ctx.fillStyle='rgba(255,240,200,.35)'; ctx.beginPath(); ctx.arc(-r*0.35,-r*0.35,r*0.22,0,7); ctx.fill();
      ctx.restore();
    }

    let finishing = false;
    async function finish(){
      if (finishing) return;            // guard: never run the end sequence twice
      finishing = true;
      running = false; cancelAnimationFrame(rafId); clearInterval(tickId);
      playedToday = true; goBtn.disabled = true; goBtn.textContent = 'Đã chơi hôm nay 🌙';
      resultEl.textContent = `🎉 Vào đích ${goals} lần!`;   // show result immediately
      confetti();
      try {
        const resp = await fetch('/api/puzzle/win', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ goals }) });
        if (resp.status === 401){ location.href = '/'; return; }
        const r = await resp.json();
        if (resp.ok){ resultEl.textContent = `🎉 Vào đích ${goals} lần! Nhận ${r.reward} lửa 🔥`; if(r.wallet) balEl.textContent = r.wallet.balance; }
        else { resultEl.textContent = 'Bạn đã chơi hôm nay rồi 🌙'; if(r.wallet) balEl.textContent = r.wallet.balance; }
      } catch(e){ /* mạng trục trặc — vẫn cho về trang chính, không kẹt */ }
      showCheer({delay:900});          // always end with the message + back to hub
    }

    // ---- controls ----
    function onOrient(e){
      // gamma = left-right tilt, beta = front-back tilt
      if (e.gamma == null) { noSensor = true; return; }
      tiltX = Math.max(-1, Math.min(1, e.gamma / 30));
      tiltY = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
    }
    async function enableTilt(){
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
        try { const p = await DeviceOrientationEvent.requestPermission(); if (p !== 'granted') noSensor = true; }
        catch(e){ noSensor = true; }
      } else if (typeof DeviceOrientationEvent === 'undefined'){ noSensor = true; }
      if (!noSensor) window.addEventListener('deviceorientation', onOrient);
    }
    // desktop / no-sensor fallback: drag on the canvas to steer
    cv.addEventListener('pointerdown', e=>{ dragging=true; steer(e); });
    cv.addEventListener('pointermove', e=>{ if(dragging) steer(e); });
    cv.addEventListener('pointerup', ()=>{ dragging=false; if(noSensor){ tiltX=0; tiltY=0; } });
    cv.addEventListener('pointerleave', ()=>{ dragging=false; if(noSensor){ tiltX=0; tiltY=0; } });
    function steer(e){
      if (!noSensor) return;
      const r = cv.getBoundingClientRect();
      tiltX = Math.max(-1, Math.min(1, ((e.clientX-r.left)/r.width - 0.5) * 2.4));
      tiltY = Math.max(-1, Math.min(1, ((e.clientY-r.top)/r.height - 0.5) * 2.4));
    }

    // pretty preview before the game starts, so the arena looks inviting
    function previewScene(){
      ball = { x:W*0.5, y:H-40 }; vel = {x:0,y:0}; trail = []; sparks = []; goals = 0;
      holes = [ {x:W*0.28,y:H*0.4,r:20}, {x:W*0.7,y:H*0.55,r:20}, {x:W*0.5,y:H*0.28,r:20} ];
      goal = { x:W*0.5, y:H*0.16, r:22 };
      let raf; (function anim(){ tnow=performance.now(); draw(); if(!started) raf=requestAnimationFrame(anim); })();
    }

    function confetti(){
      const icons = ['🥮','🏮','🔥','🌟','🎉'];
      for (let i=0;i<20;i++){
        const c = document.createElement('div');
        c.className='confetti'; c.textContent = icons[i%icons.length];
        c.style.left = Math.random()*100+'vw';
        c.style.animationDuration = (1.4+Math.random()*1.4)+'s';
        c.style.animationDelay = (Math.random()*0.4)+'s';
        document.body.appendChild(c); setTimeout(()=>c.remove(), 3200);
      }
    }

    goBtn.addEventListener('click', async ()=>{
      if (!started){ await enableTilt(); start(); }
    });
    addEventListener('resize', ()=>{ sizeCanvas(); if(!running && !started) previewScene(); });
    sizeCanvas();
    loadWallet();
    previewScene();
    window.addEventListener('pageshow', loadWallet);
  </script>
<script src="/cheer.js"></script>
  <script>
    (function(){
      const nav = document.getElementById('rnav'), btn = document.getElementById('rnavBtn');
      btn.addEventListener('click', e=>{ e.stopPropagation(); const open = nav.classList.toggle('open'); btn.setAttribute('aria-expanded', open?'true':'false'); });
      document.addEventListener('click', e=>{ if(!nav.contains(e.target)){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); } });
      document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); } });
    })();
  </script>
</body>
</html>
