<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt lồng đèn — Người vận hành</title>
<style>
  *{box-sizing:border-box;margin:0;}
  body{ font-family:system-ui,sans-serif; background:#14101f; color:#eee; min-height:100vh; }
  header{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px;
          padding:14px 20px; background:#1e1730; border-bottom:1px solid #ffffff14; }
  header h1{ font-size:18px; font-weight:800; }
  .count{ background:#ff8c1a; color:#160c2e; font-weight:800; border-radius:999px; padding:3px 12px; font-size:14px; }
  .muted{ margin-left:auto; color:#9b8fbf; font-size:13px; }
  .empty{ text-align:center; padding:80px 20px; color:#8a7fb0; }
  .empty .big{ font-size:54px; margin-bottom:10px; }
  #grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; padding:20px; }
  .card{ background:#20182f; border:1px solid #ffffff12; border-radius:16px; overflow:hidden;
         display:flex; flex-direction:column; box-shadow:0 6px 20px #0005; animation:in .25s ease; }
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pic{ position:relative; background:repeating-conic-gradient(#2a2140 0% 25%, #241b36 0% 50%) 50%/22px 22px;
        aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .pic img{ max-width:88%; max-height:88%; filter:drop-shadow(0 4px 14px #000a); }
  .badge{ position:absolute; top:8px; left:8px; background:#6d4cff; color:#fff; font-size:11px;
          font-weight:800; padding:3px 8px; border-radius:999px; box-shadow:0 2px 8px #0006; }
  .spin{ position:absolute; width:44px; height:44px; border:4px solid #ffffff22;
         border-top-color:#ffd166; border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .wait{ flex:1; border:0; padding:14px; font-weight:800; color:#c9b8ff; background:#2a2140; }
  .meta{ padding:10px 12px; font-size:13px; color:#c9b8ff; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .meta b{ color:#ffe9b0; font-size:15px; }
  .meta .t{ color:#8a7fb0; font-size:11px; }
  .wish{ padding:0 12px 10px; font-size:13px; font-style:italic; color:#ffe9b0; line-height:1.4; }
  .btns{ display:flex; gap:0; }
  .btns button{ flex:1; border:0; padding:14px; font-size:15px; font-weight:800; color:#fff; cursor:pointer; }
  .ok{ background:#2e7d32; } .ok:hover{ background:#388e3c; }
  .no{ background:#5a2333; color:#ff9db0; } .no:hover{ background:#7a2e44; }
  .bar{ display:flex; gap:10px; padding:0 20px 20px; }
  .bar button{ background:#2a2140; color:#ffe9b0; border:1px solid #ffffff14; border-radius:10px;
               padding:10px 16px; font-weight:700; cursor:pointer; }
  .bar button:hover{ background:#352a52; }
</style>
</head>
<body>
<header>
  <h1>🛡️ Duyệt lồng đèn</h1>
  <span class="count" id="count">0</span>
  <span class="muted" id="status">Đang chờ duyệt · tự cập nhật</span>
</header>

<div class="bar">
  <button id="approveAll">✓ Duyệt tất cả</button>
  <button id="refresh">↻ Tải lại</button>
</div>

<div id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <div class="big">🏮</div>
  <div>Chưa có lồng đèn nào chờ duyệt.</div>
  <div style="margin-top:6px;color:#6d6390">Lồng đèn mới của các bé sẽ hiện ở đây.</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');

async function load(){
  let list = [];
  try { list = await (await fetch('/api/pending')).json(); } catch(e){}
  grid.innerHTML = '';
  countEl.textContent = list.length;
  empty.style.display = list.length ? 'none' : 'block';
  for (const l of list) grid.appendChild(card(l));
}

function card(l){
  const el = document.createElement('div');
  el.className = 'card';
  const when = new Date(l.created).toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit'});
  const shownFile = l.ai_file || l.file;      // show AI render once ready
  const aiBadge = l.ai_file ? '<span class="badge">✨ AI 3D</span>' : '';

  if (l.status === 'processing'){
    // still being rendered by the AI — show original + spinner, no buttons yet
    el.innerHTML = `
      <div class="pic"><img src="/lanterns/${l.file}" alt="" style="opacity:.5">
        <div class="spin"></div></div>
      <div class="meta"><b>${l.name ? escapeHtml(l.name) : '(không tên)'}</b>
        <span class="t">⏳ đang tạo 3D…</span></div>
      <div class="btns"><button class="wait" disabled>Đang xử lý AI…</button></div>`;
    return el;
  }
  el.innerHTML = `
    <div class="pic">${aiBadge}<img src="/lanterns/${shownFile}" alt=""></div>
    <div class="meta"><b>${l.name ? escapeHtml(l.name) : '(không tên)'}</b>
      <span class="t">${l.template||''} · ${when}</span></div>
    ${l.wish ? `<div class="wish">💭 “${escapeHtml(l.wish)}”</div>` : ''}
    <div class="btns">
      <button class="no"  data-id="${l.id}" data-a="reject">✕ Từ chối</button>
      <button class="ok"  data-id="${l.id}" data-a="approve">✓ Duyệt</button>
    </div>`;
  el.querySelectorAll('button:not([disabled])').forEach(b => b.onclick = () => moderate(b.dataset.id, b.dataset.a, el));
  return el;
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function moderate(id, action, el){
  el.style.opacity = .4;
  try{
    await fetch('/api/moderate',{method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id:+id, action })});
    el.remove();
    const n = grid.querySelectorAll('.card').length;
    countEl.textContent = n; empty.style.display = n ? 'none' : 'block';
  }catch(e){ el.style.opacity = 1; alert('Lỗi, thử lại'); }
}

document.getElementById('refresh').onclick = load;
document.getElementById('approveAll').onclick = async () => {
  const btns = [...grid.querySelectorAll('button[data-a="approve"]')];
  if (!btns.length) return;
  if (!confirm(`Duyệt tất cả ${btns.length} lồng đèn?`)) return;
  for (const b of btns){ await moderate(b.dataset.id, 'approve', b.closest('.card')); }
};

// live: reload the queue whenever something changes
const socket = io();
socket.on('pending-changed', load);
load();
</script>
</body>
</html>
