<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quét mã — Lồng đèn Trung thu</title>
<style>
  *{box-sizing:border-box;margin:0;}
  html,body{height:100%;overflow:hidden;}
  body{ font-family:system-ui,sans-serif; color:#ffe9b0;
        display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        background:
          radial-gradient(900px 500px at 50% -6%, #5a2a8a55, transparent 60%),
          radial-gradient(700px 500px at 50% 110%, #7a1f3a44, transparent 60%),
          linear-gradient(180deg,#241348,#140a28); }
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #moon{ position:fixed; top:6vh; left:50%; transform:translateX(-50%); z-index:0;
         font-size:9vw; filter:drop-shadow(0 0 50px #ffe6a8); animation:bob 5s ease-in-out infinite; opacity:.8; }
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-16px)}}

  .card{ position:relative; z-index:1; padding:3.2vh 3vw 3vh; border-radius:32px;
         background:linear-gradient(160deg,#9a2016,#c23a22 55%,#8a1a12);
         border:4px solid #ffd77a;
         box-shadow:0 24px 70px #000b, 0 0 70px #ffcf6a44, inset 0 2px 0 #fff4; }
  .card::before{content:'';position:absolute;inset:9px;border:1.5px solid #ffd77a55;border-radius:24px;pointer-events:none;}
  /* corner flourishes */
  .card span.cn{position:absolute;font-size:20px;opacity:.8;filter:drop-shadow(0 0 6px #ffd77a);}
  .cn.tl{top:8px;left:12px}.cn.tr{top:8px;right:12px}.cn.bl{bottom:8px;left:12px}.cn.br{bottom:8px;right:12px}

  .lantern{font-size:8vh;margin-top:-7vh;filter:drop-shadow(0 0 26px #ffd77a);animation:sway 3s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
  h1{font-size:min(4.4vh,40px);color:#fff;margin:6px 0 4px;text-shadow:0 2px 12px #0008;font-weight:900;letter-spacing:.3px;}
  .sub{font-size:min(2.3vh,20px);color:#ffe9b0;margin-bottom:2.4vh;opacity:.95;}
  .qrbox{ position:relative; background:#fff8ea; padding:20px; border-radius:22px;
          box-shadow:inset 0 0 0 3px #ffd77a, 0 8px 24px #0006; display:inline-block; }
  .qrbox::after{ content:'📷'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
                 font-size:0; }
  .qrbox img{ display:block; width:min(46vh,380px); height:auto; image-rendering:pixelated; border-radius:6px; }
  .scan{ position:absolute; left:20px; right:20px; height:3px; border-radius:3px;
         background:linear-gradient(90deg,transparent,#c23a22,transparent); box-shadow:0 0 10px #c23a2288;
         animation:scan 2.4s ease-in-out infinite; }
  @keyframes scan{0%,100%{top:24px}50%{top:calc(100% - 24px)}}
  .foot{ margin-top:2.2vh; font-size:min(2.6vh,24px); font-weight:900; color:#ffd77a; letter-spacing:.5px;
         text-shadow:0 0 14px #ffcf6a66; }
  .url{ margin-top:6px; font-size:13px; color:#ffcf9e88; }

  .steps{ position:fixed; bottom:3vh; left:0; right:0; z-index:1;
          display:flex; gap:14px; justify-content:center; flex-wrap:wrap; padding:0 16px; }
  .step{ display:flex; align-items:center; gap:9px; color:#e7dcff; font-size:min(2.1vh,17px); font-weight:600; }
  .step .n{ display:grid; place-items:center; width:30px; height:30px; border-radius:50%;
            background:linear-gradient(180deg,#ffe08a,#ff9a1a); color:#3a1500; font-weight:900; font-size:15px;
            box-shadow:0 3px 10px #ff8c1a66; }
  .step .sep{ color:#ffd77a66; margin-left:6px; }
</style>
</head>
<body>
<canvas class="bg"></canvas>
<div id="moon">🌕</div>

<div class="card">
  <span class="cn tl">✦</span><span class="cn tr">✦</span><span class="cn bl">✦</span><span class="cn br">✦</span>
  <div class="lantern">🏮</div>
  <h1>Bé ơi, quét mã nào!</h1>
  <div class="sub">Tô lồng đèn của riêng bé rồi thả lên bầu trời ✨</div>
  <div class="qrbox">
    <div class="scan"></div>
    <img id="qrImg" alt="QR">
  </div>
  <div class="foot">🌕 Vui Tết Trung Thu 🌕</div>
  <div class="url" id="url"></div>
</div>

<div class="steps">
  <div class="step"><span class="n">1</span> Quét mã <span class="sep">›</span></div>
  <div class="step"><span class="n">2</span> Điền tên &amp; chọn mẫu <span class="sep">›</span></div>
  <div class="step"><span class="n">3</span> Tô màu <span class="sep">›</span></div>
  <div class="step"><span class="n">4</span> Thả đèn lên trời</div>
</div>

<script>
fetch('/api/qr').then(r=>r.json()).then(({url,dataUrl})=>{
  if(dataUrl) document.getElementById('qrImg').src = dataUrl;
  if(url) document.getElementById('url').textContent = url;
}).catch(()=>{});

// backdrop: twinkling stars + a few drifting lanterns
const cv=document.querySelector('.bg'), c=cv.getContext('2d');
let W,H,stars=[],floats=[];
function resize(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.7+0.4,tw:Math.random()*6.28,sp:0.5+Math.random()*2}));
  floats=Array.from({length:9},(_,i)=>({x:Math.random(),y:Math.random(),s:22+Math.random()*26,sp:6+Math.random()*10,ph:Math.random()*6.28}));
}
resize(); addEventListener('resize',resize);
function loop(t){
  c.clearRect(0,0,W,H);
  for(const s of stars){ c.globalAlpha=0.4+0.6*Math.abs(Math.sin(t*0.001*s.sp+s.tw));
    c.fillStyle='#fff'; c.beginPath(); c.arc(s.x*W,s.y*H,s.r,0,6.28); c.fill(); }
  c.globalAlpha=1;
  c.font='28px system-ui'; c.textAlign='center';
  for(const f of floats){
    const y=((f.y - t/1000/f.sp) % 1 + 1) % 1;
    c.globalAlpha=0.25+0.15*Math.sin(t*0.001+f.ph);
    c.font=f.s+'px system-ui';
    c.fillText('🏮', (f.x+0.03*Math.sin(t*0.0006+f.ph))*W, y*H);
  }
  c.globalAlpha=1;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
