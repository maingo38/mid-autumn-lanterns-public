<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vòng Quay Ánh Trăng</title>
<style>
  :root{ --gold:#ffd77a; --gold2:#ffe9b0; --deep:#0a0620; --rim:#b5340c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:#fff; background:#0d0a26 url('/decor/Background.jpeg') center top / cover no-repeat fixed;
    min-height:100vh; overflow-x:hidden; text-align:center; display:flex; flex-direction:column; align-items:center; }
  /* drifting stars */
  body::after{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
    background-image:radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 20%, #fff, transparent), radial-gradient(1px 1px at 40% 60%, #fff, transparent), radial-gradient(1.5px 1.5px at 85% 55%, #fff, transparent), radial-gradient(1px 1px at 55% 80%, #fff, transparent), radial-gradient(1px 1px at 12% 75%, #fff, transparent);
    background-repeat:no-repeat; }
  h1{ margin:24px 16px 4px; font-size:clamp(25px,6.2vw,40px); font-weight:800; position:relative; z-index:2;
    background:linear-gradient(180deg,#fff6e2,var(--gold) 55%,#ff8c1a);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 34px rgba(255,180,80,.3); }
  .sub{ color:#cbb8ff; font-size:14px; margin:0 20px; position:relative; z-index:2; max-width:330px; line-height:1.45; }

  .stage{ position:relative; width:min(84vw,340px); margin:30px auto 0; z-index:2; }

  /* wheel */
  .wheelWrap{ position:relative; width:100%; aspect-ratio:1; z-index:2; }
  .pointer{ position:absolute; top:-14px; left:50%; transform:translateX(-50%); z-index:7; filter:drop-shadow(0 4px 5px rgba(0,0,0,.6)); }
  .pointer svg{ display:block; }
  .wheel{ width:100%; height:100%; border-radius:50%; position:relative; z-index:3;
    border:10px solid #ffd77a;
    box-shadow:0 0 0 8px var(--rim), 0 0 0 10px #ffcf6a, 0 0 34px rgba(255,180,80,.4), 0 20px 50px rgba(0,0,0,.6), inset 0 0 50px rgba(90,20,0,.45);
    transition:transform 4.8s cubic-bezier(.12,.64,.1,1); }
  /* golden bead ring on the rim */
  .beads{ position:absolute; inset:-10px; z-index:4; pointer-events:none; }
  .beads i{ position:absolute; top:50%; left:50%; width:9px; height:9px; margin:-4.5px; border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #fff6e2, #ffcf6a 60%, #d98b1f); box-shadow:0 0 5px rgba(255,210,120,.9); }
  .lbl{ position:absolute; width:56px; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .lbl .fire{ font-size:22px; line-height:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .lbl .num{ font-size:32px; line-height:1.02; font-weight:900; color:#5a1e00; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  .lbl .unit{ font-size:11px; font-weight:800; color:#7a2e00; opacity:.9; }
  /* jackpot (4 fire) sits on the red slice — light text so it stays readable */
  .lbl.jackpot .num{ color:#fff; text-shadow:0 1px 3px rgba(120,0,0,.7); }
  .lbl.jackpot .unit{ color:#ffe2d0; }
  .hub{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:72px; height:72px; z-index:6;
    border-radius:50%; background:radial-gradient(circle at 50% 30%,#fff8e6,#ffe9b0 45%,#ffb84d 78%,#ff8c1a);
    box-shadow:0 0 0 6px var(--rim), 0 0 0 8px #ffcf6a, 0 6px 16px rgba(0,0,0,.6), inset 0 -8px 14px rgba(180,60,0,.45), inset 0 6px 10px rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center; font-size:34px; }

  /* Bàn Thờ Ngọc in a glowing moon disc — full brightness, no blend, 3D lift.
     Disc sits at the lower-right, pushed out so it never covers a wheel number. */
  .rabbit{ position:absolute; right:-92px; bottom:-78px; width:150px; height:150px; z-index:8;
    border-radius:50%; overflow:hidden;
    background:radial-gradient(circle at 50% 44%, #fff9ec 0%, #ffeecb 60%, #ffe0a6 82%);
    box-shadow:0 0 0 4px rgba(255,240,200,.9), 0 0 28px 7px rgba(255,220,150,.7), 0 16px 28px rgba(120,50,0,.55);
    animation:floaty 3.4s ease-in-out infinite; }
  /* frame the bunny's face+bow: source is 1024x1536, face ~centre at 50%/42% */
  .rabbit img{ position:absolute; width:150%; left:-25%; top:-32%;
    -webkit-mask:radial-gradient(circle at 50% 50%, #000 62%, transparent 76%); mask:radial-gradient(circle at 50% 50%, #000 62%, transparent 76%); }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-2deg) } 50%{ transform:translateY(-12px) rotate(2deg) } }

  .bal{ margin-top:24px; font-weight:800; color:var(--gold2); font-size:18px; position:relative; z-index:2; }
  .spinBtn{ margin-top:16px; border:none; cursor:pointer; font-size:22px; font-weight:800; color:#fff; position:relative; z-index:2;
    padding:16px 50px; border-radius:999px; background:radial-gradient(circle at 50% 26%, #ffa63d, #ff8c1a 40%, #b5340c);
    box-shadow:0 8px 24px rgba(255,120,20,.6), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 8px rgba(120,30,0,.5); transition:transform .12s; }
  .spinBtn:active{ transform:scale(.95); }
  .spinBtn:disabled{ background:radial-gradient(circle at 50% 26%,#6b5a2a,#3a2f12); box-shadow:none; opacity:.7; cursor:default; }
  .result{ margin:16px; min-height:26px; font-size:20px; font-weight:800; color:var(--gold); position:relative; z-index:2; }
  .backlink{ display:inline-block; margin:4px 0 44px; color:#cbb8ff; text-decoration:none; font-weight:700; position:relative; z-index:2;
    border:1px solid rgba(255,215,120,.3); border-radius:999px; padding:10px 24px; }
  .pop{ animation:pop .5s ease; }
  @keyframes pop{ 0%{ transform:scale(.6); opacity:0 } 60%{ transform:scale(1.15) } 100%{ transform:scale(1); opacity:1 } }
  /* lu1edbp phu1ee7 tu1889 nhu1eb9 tru00ean nu1ec1n demo -> chu1eef du1ec5 u0111u1ecdc */
  body::before{ content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, #0a081e33 0%, #0a081e66 55%, #0a081eaa 100%); }
</style>
</head>
<body>
  <h1>🎡 Quay Số May Rủi Như Chờ Lương</h1>
  <div class="sub">Quay mỗi ngày để nhận lửa, rồi mang đi bình chọn lồng đèn bạn thích!</div>

  <div class="stage">
    <div class="wheelWrap">
      <div class="pointer">
        <svg width="38" height="46" viewBox="0 0 38 46"><path d="M19 44 L3 12 A18 14 0 0 1 35 12 Z" fill="#fff2cf" stroke="#b5340c" stroke-width="3" stroke-linejoin="round"/><circle cx="19" cy="13" r="5" fill="#ff8c1a"/></svg>
      </div>
      <div class="wheel" id="wheel"></div>
      <div class="beads" id="beads"></div>
      <div class="hub">🌕</div>
    </div>
    <div class="rabbit"><img src="/decor/ban-tho-ngoc.png" alt="Bàn Thờ Ngọc"></div>
  </div>

  <div class="bal" id="bal">🔥 …</div>
  <button class="spinBtn" id="spinBtn" disabled>Quay!</button>
  <div class="result" id="result"></div>
  <a class="backlink" href="/hub">← Về trang chính</a>
  <a class="backlink" href="/rank">🏆 Bảng xếp hạng</a>

  <script>
    // identity comes from the Google session cookie now; no localStorage id.

    // colour BY VALUE so the wheel reads at a glance: more fires = hotter colour.
    // 1 = soft gold, 2 = amber, 3 = orange, 4 = festive red (the jackpot).
    const VALUE_COLORS = { 1:'#ffe6a3', 2:'#ffb84d', 3:'#ff8c3a', 4:'#ef5350' };
    const colorFor = v => VALUE_COLORS[v] || '#ffcf6a';
    let wheelVals = [1,4,2,1,4,3];   // mirrors server WHEEL; overwritten by /api/wallet
    let rotation = 0, busy = false, canSpin = true;

    const wheelEl = document.getElementById('wheel');
    const beadsEl = document.getElementById('beads');
    const balEl = document.getElementById('bal');
    const btn = document.getElementById('spinBtn');
    const resultEl = document.getElementById('result');

    function buildWheel(){
      const n = wheelVals.length, seg = 360/n;
      // pie: slice i centred on conic angle i*seg (start offset -seg/2). Thin white dividers.
      const stops = [];
      wheelVals.forEach((v,i)=>{
        const c = colorFor(v);
        stops.push(`${c} ${i*seg}deg ${(i+1)*seg-0.6}deg`, `#fff2cf ${(i+1)*seg-0.6}deg ${(i+1)*seg}deg`);
      });
      wheelEl.style.background = `conic-gradient(from ${-seg/2}deg, ${stops.join(',')})`;

      wheelEl.querySelectorAll('.lbl').forEach(e=>e.remove());
      const R = 33;
      wheelVals.forEach((v,i)=>{
        const deg = i*seg;                       // this slice's centre angle (from top)
        const A = deg * Math.PI/180;
        const x = 50 + R*Math.sin(A), y = 50 - R*Math.cos(A);
        const lbl = document.createElement('div');
        lbl.className = 'lbl' + (v===4 ? ' jackpot' : ''); lbl.style.left = x + '%'; lbl.style.top = y + '%';
        // rotate the label to sit ALONG its slice (radial) so it spins naturally
        lbl.style.transform = `translate(-50%,-50%) rotate(${deg}deg)`;
        lbl.innerHTML = `<span class="fire">🔥</span><span class="num">${v}</span><span class="unit">lửa</span>`;
        wheelEl.appendChild(lbl);
      });

      // bead ring: place dots on a circle just outside the rim
      beadsEl.innerHTML = '';
      const N = 24, RR = 50;
      for(let k=0;k<N;k++){
        const a = (k/N)*2*Math.PI;
        const b = document.createElement('i');
        b.style.left = (50 + RR*Math.cos(a)) + '%';
        b.style.top  = (50 + RR*Math.sin(a)) + '%';
        beadsEl.appendChild(b);
      }
    }

    function paintWallet(w){
      canSpin = w.canSpin;
      const streak = w.days ? `  ·  điểm danh ${w.days}/5 ngày` : '';
      balEl.textContent = `🔥 ${w.balance} lửa` + streak;
      if (!canSpin){ btn.disabled = true; btn.textContent = 'Đã quay hôm nay 🌙';
        if(!resultEl.textContent) resultEl.textContent = 'Mai quay lại để nhận thêm lửa nhé!'; }
      else { btn.disabled = false; btn.textContent = 'Quay!'; }
    }

    async function init(){
      const r = await (await fetch('/api/wallet')).json();
      if (r.wheel) wheelVals = r.wheel;
      buildWheel();
      if (!r.wallet){ location.href = '/'; return; }   // not signed in -> go log in
      paintWallet(r.wallet);
    }

    async function spin(){
      if (busy || !canSpin) return;
      busy = true; btn.disabled = true; resultEl.textContent = '';
      let resp, r;
      try {
        resp = await fetch('/api/spin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({}) });
        if (resp.status === 401){ location.href = '/'; return; }
        r = await resp.json();
      } catch(e){ busy=false; btn.disabled=false; resultEl.textContent='Lỗi kết nối, thử lại nhé!'; return; }
      if (!resp.ok){ busy=false; if(r && r.wallet) paintWallet(r.wallet); if(r && r.error==='already_spun') showCheer({delay:400}); return; }
      if (r.wheel) wheelVals = r.wheel;

      const seg = 360/wheelVals.length;
      const target = r.segment*seg;
      rotation += 5*360 + ((360 - target) - (rotation % 360) + 360) % 360;
      wheelEl.style.transform = `rotate(${rotation}deg)`;

      setTimeout(()=>{
        let msg = `🎉 Bạn nhận được ${r.reward} lửa!`;
        if (r.bonus) msg += `  🏅 +${r.bonus} thưởng điểm danh ${r.days} ngày!`;
        resultEl.textContent = msg;
        resultEl.classList.remove('pop'); void resultEl.offsetWidth; resultEl.classList.add('pop');
        paintWallet(r.wallet);
        busy = false;
        showCheer({delay:600});
      }, 4900);
    }

    btn.addEventListener('click', spin);
    init();
  </script>
  <script src="/cheer.js"></script>
</body>
</html>
